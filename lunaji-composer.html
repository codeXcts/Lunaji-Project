<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lunaji Composer</title>
<meta name="lunaji-build" content="2026-10-30-0101">
<style>
:root{
  --bg:#f6f3ee; --card:#fffdf9; --ink:#24211d; --muted:#6f685e; --line:#e3ddd2;
  --accent:#3b5bdb; --accent-soft:#e7ecfd;
  --part:#2f6f4f; --part-soft:#e2f1e8;
  --end:#9a4d12; --end-soft:#fbeadb;
  --elide:#7a3fa0; --elide-soft:#f1e6f8;
  --gap:#a3282b; --gap-soft:#fbe5e5;
  --warn:#8a5a00; --warn-soft:#fff4d6;
  --shadow:0 1px 2px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16171a; --card:#1f2024; --ink:#ece8e1; --muted:#a39d93; --line:#33343a;
    --accent:#8ea6ff; --accent-soft:#252c45;
    --part:#7fd1a4; --part-soft:#1d3328;
    --end:#f2a66a; --end-soft:#3a2818;
    --elide:#cf9bf0; --elide-soft:#33243d;
    --gap:#ff8f8f; --gap-soft:#3d2022;
    --warn:#f3c560; --warn-soft:#3a2f14;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#16171a; --card:#1f2024; --ink:#ece8e1; --muted:#a39d93; --line:#33343a;
  --accent:#8ea6ff; --accent-soft:#252c45;
  --part:#7fd1a4; --part-soft:#1d3328;
  --end:#f2a66a; --end-soft:#3a2818;
  --elide:#cf9bf0; --elide-soft:#33243d;
  --gap:#ff8f8f; --gap-soft:#3d2022;
  --warn:#f3c560; --warn-soft:#3a2f14;
  --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:640px;margin:0 auto;padding:0 16px 96px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:14px 0 8px}
header h1{font-size:18px;margin:0;letter-spacing:.02em}
header .meta{font-size:12px;color:var(--muted);text-align:right}
button{font:inherit;color:inherit}
.lu{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif}

.result{position:sticky;top:0;z-index:5;background:var(--bg);padding:6px 0 10px}
.rcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 14px 12px;box-shadow:var(--shadow);max-height:46vh;overflow:auto}
.sentence{font-size:25px;line-height:1.4;word-break:break-word;min-height:1.4em}
.sentence .w{white-space:nowrap}
.pc{border-radius:4px;padding:0 1px;cursor:pointer}
.pc.part{color:var(--part);background:var(--part-soft)}
.pc.end{color:var(--end);background:var(--end-soft)}
.pc.elide{color:var(--elide);background:var(--elide-soft)}
.pc.gap{color:var(--gap);background:var(--gap-soft);border:1px dashed var(--gap);font-family:system-ui,sans-serif;font-size:.8em;padding:0 4px}
.pc.root.noted{text-decoration:underline dotted var(--muted);text-underline-offset:4px}
.pc.sel{outline:2px solid var(--accent);outline-offset:1px}
.built{font-size:13px;color:var(--muted);margin-top:6px}
.answers{font-size:14px;margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
.answers .lu{font-size:17px}
.tip{margin-top:10px;font-size:14px;background:var(--accent-soft);border-radius:10px;padding:8px 10px;display:none}
.tip.on{display:block}
.tip b{font-family:"Iowan Old Style",Palatino,Georgia,serif;font-size:16px}
.placeholder{color:var(--muted);font-size:16px}
.nc{background:var(--warn-soft);border-left:3px solid var(--warn);border-radius:8px;padding:8px 10px;font-size:14px;margin-top:6px}
.nc b{color:var(--warn)}

.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px;margin:8px 0 10px}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:9px 2px;font-size:14px;cursor:pointer}
.seg button.on{background:var(--accent);color:#fff}
:root[data-theme="dark"] .seg button.on{color:#111}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .seg button.on{color:#111}}
.group{border-left:3px solid var(--line);padding-left:10px;margin:14px 0 4px}
.group.c2{border-left-color:var(--accent)}
.ghead{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:4px 0 6px}
.ghead button{border:0;background:transparent;color:var(--accent);font-size:13px;cursor:pointer;text-transform:none;letter-spacing:0;font-weight:500}
.slot{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.slot.off{opacity:.6}
.slot .lab{font-size:13px;color:var(--muted);display:flex;justify-content:space-between;align-items:center;gap:8px}
.slot .lab .req{color:var(--accent)}
.pick{display:flex;align-items:center;gap:8px;margin-top:6px}
.pick .val{flex:1;border:1px solid var(--line);background:transparent;border-radius:10px;padding:10px 12px;text-align:left;cursor:pointer;min-height:46px}
.pick .val .en{font-size:15px}
.pick .val .luv{font-size:17px;margin-left:6px;color:var(--muted)}
.pick .val.empty{color:var(--muted)}
.x{border:0;background:transparent;font-size:22px;color:var(--muted);width:40px;height:40px;cursor:pointer;border-radius:10px;flex:none}
.opts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}
.opts .ol{font-size:12px;color:var(--muted);margin-right:2px}
.opts button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 11px;font-size:14px;cursor:pointer}
.opts button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.opts button:disabled{opacity:.4}
.opts.small button{font-size:13px;padding:5px 10px}
.chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:3px 4px 3px 10px;font-size:13px}
.chip button{border:0;background:transparent;color:var(--accent);font-size:16px;padding:0 6px;cursor:pointer}
.numrow{display:flex;gap:6px;align-items:center;margin-top:8px;font-size:13px;color:var(--muted)}
.numrow input{width:70px;font-size:16px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.more{border:0;background:transparent;color:var(--accent);font-size:14px;padding:8px 0 0;cursor:pointer}
.hint{font-size:13px;color:var(--muted);margin-top:6px}
.addc{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:6px 0 0}
.addc span{font-size:13px;color:var(--muted)}
.addc button{border:1px dashed var(--accent);color:var(--accent);background:transparent;border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer}

h2{font-size:15px;margin:22px 0 8px;color:var(--muted);font-weight:600;letter-spacing:.02em}
.why{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px 12px}
.why .row{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.why .row:last-child{border-bottom:0}
.why .row .k{min-width:72px;font-size:17px}
.why .gen{color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--muted);margin-top:8px}
.legend .pc{cursor:default}

.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;z-index:20}
.scrim.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:88vh;background:var(--card);border-radius:18px 18px 0 0;z-index:21;display:none;flex-direction:column;box-shadow:0 -6px 24px rgba(0,0,0,.2);max-width:640px;margin:0 auto}
.sheet.on{display:flex}
.sheet .top{padding:12px 16px 8px;border-bottom:1px solid var(--line)}
.sheet .top .t{display:flex;justify-content:space-between;align-items:center;font-weight:600}
.sheet .top .t button{border:0;background:transparent;font-size:15px;color:var(--accent);cursor:pointer;padding:6px}
.sheet input{width:100%;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);margin-top:8px}
.sheet .list{overflow:auto;padding:4px 8px 24px;-webkit-overflow-scrolling:touch}
.sheet .sec{font-size:12px;color:var(--muted);padding:12px 8px 4px;text-transform:uppercase;letter-spacing:.06em}
.sheet .it{display:flex;justify-content:space-between;align-items:baseline;gap:10px;width:100%;border:0;background:transparent;padding:11px 8px;border-radius:10px;text-align:left;cursor:pointer;font-size:15px}
.sheet .it:active,.sheet .it:hover{background:var(--accent-soft)}
.sheet .it .l{font-size:17px;color:var(--muted);white-space:nowrap}
.sheet .gapbtn{margin:10px 8px 0;border:1px dashed var(--gap);color:var(--gap);background:var(--gap-soft);border-radius:10px;padding:10px;width:calc(100% - 16px);cursor:pointer;font-size:14px}
.sheet .namebtn{border:1px solid var(--accent);color:var(--accent);background:var(--accent-soft)}
.sheet .more2{font-size:13px;color:var(--muted);padding:8px}

.seg.mini{margin:0 0 4px;max-width:220px}
.seg.mini button{padding:6px 2px;font-size:13px}
.acts{display:flex;gap:8px;align-items:center;margin-top:10px}
.acts button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 14px;font-size:14px;cursor:pointer}
.acts #saveBtn{border-color:var(--accent);color:var(--accent)}
#flash{font-size:13px;color:var(--part);opacity:0;transition:opacity .2s}
#flash.on{opacity:1}
.row2{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:8px;overflow:hidden}
.row2.off{opacity:.6}
.row2.open{border-color:var(--accent)}
.rhead{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;padding:12px;text-align:left;cursor:pointer;min-height:52px}
.rhead .rl{font-size:13px;color:var(--muted);flex:0 0 32%;line-height:1.25}
.rhead .rl em{font-style:normal;color:var(--accent);display:block;font-size:11px}
.rhead .rv{flex:1;font-size:15px;line-height:1.3;word-break:break-word}
.rhead .rv .lu{font-size:17px;color:var(--muted)}
.rhead .rv .tags{display:block;font-size:12px;color:var(--accent)}
.rhead .rv i{color:var(--muted);font-style:normal}
.rhead .ph{color:var(--muted)}
.rhead .chev{color:var(--muted);font-size:12px}
.rbody{padding:0 12px 12px}
.crumbs{display:flex;align-items:center;gap:10px;margin:4px 0 10px;font-size:13px;color:var(--muted)}
.crumbs button{border:1px solid var(--accent);color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer;flex:none}
.gobtn{display:flex;justify-content:space-between;align-items:center;gap:8px;flex:1;border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:10px;padding:10px 12px;font-size:14px;cursor:pointer;text-align:left;margin-top:8px}
.gobtn span{font-size:18px}
.detbtn{border:0;background:transparent;color:var(--accent);font-size:14px;padding:8px 0 0;cursor:pointer}
.crow{display:flex;align-items:center;gap:6px}
.ghead2{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:16px 0 4px}
.sv{display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--line)}
.svopen{flex:1;border:0;background:transparent;text-align:left;padding:10px 8px;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.svopen .lu{font-size:18px}
.svb{font-size:12px;color:var(--muted)}
.lex{font-size:13px;color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-top:22px}
.lex button,.lex label{border:1px solid var(--line);background:transparent;border-radius:8px;padding:6px 10px;font-size:13px;cursor:pointer;display:inline-block;margin:6px 6px 0 0;color:var(--ink)}
.lex input{display:none}
.empty-lex{background:var(--warn-soft);border-radius:12px;padding:12px;margin:10px 0;font-size:14px}
.gaps{margin-top:8px;font-size:13px}
.gaps button{border:1px solid var(--line);background:transparent;border-radius:8px;padding:4px 8px;font-size:12px;cursor:pointer;margin-left:6px;color:var(--ink)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Lunaji Composer</h1>
    <div class="meta"><span id="stamp"></span><br><span id="lexline">loading lexicon…</span></div>
  </header>
  <div class="seg mini" id="modeSeg"><button data-mode="simple">Simple</button><button data-mode="full">Full</button></div>

  <div class="result">
    <div class="rcard">
      <div class="sentence lu" id="sentence"></div>
      <div class="built" id="built"></div>
      <div id="ncbox"></div>
      <div id="answers"></div>
      <div class="tip" id="tip"></div>
      <div class="acts"><button id="saveBtn">Save</button><button id="savedBtn">Saved (0)</button><span id="flash"></span></div>
    </div>
  </div>

  <div id="nolex"></div>

  <div class="seg" id="types">
    <button data-t="statement">Statement</button>
    <button data-t="question">Question</button>
    <button data-t="command">Command</button>
    <button data-t="lets">Let's</button>
  </div>

  <div id="slots"></div>

  <h2>Why each piece is there</h2>
  <div class="why" id="why"></div>
  <div class="legend">
    <span><span class="pc part">particle</span> marks what a word does</span>
    <span><span class="pc end">ending</span> on a verb</span>
    <span><span class="pc elide">n'</span> vowel dropped</span>
    <span><span class="pc gap">[gap]</span> no word yet</span>
  </div>
  <div class="gaps" id="gaps"></div>

  <div class="lex" id="lexpanel"></div>
</div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="saved" role="dialog" aria-modal="true">
  <div class="top"><div class="t"><span>Saved sentences</span><button id="savedClose">Done</button></div></div>
  <div class="list" id="savedList"></div>
</div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true">
  <div class="top">
    <div class="t"><span id="sheetTitle"></span><button id="sheetClose">Done</button></div>
    <input id="q" type="search" placeholder="Search in English" autocomplete="off" autocapitalize="off" spellcheck="false">
  </div>
  <div class="list" id="sheetList"></div>
</div>

<script>
"use strict";
/* Lunaji Composer — reads the Forge's lexicon save; builds sentences only from rules written in Grammar.md.
   Grammar.md as of its twenty-third pass, 2026-10-29. */
const BUILD = "2026-10-30-0101";
const LEX_URL = "lunaji-lexicon.txt";
const CACHE_KEY = "lunaji-composer-lex";
const STATE_KEY = "lunaji-composer-state-v2";
const NAMES_KEY = "lunaji-composer-names";

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const NASAL = {"ã":"a","ĩ":"i","õ":"o"};
const isNasal = ch => ch in NASAL;
const oral = ch => NASAL[ch] || ch;
const CONS_FINAL = /(r|l|s|z|sh)$/;
const ANY = "aeiouü";
const stripMarks = s => s.normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/ü/g,"u");
const ls = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k,v); return true; }catch(e){ return false; } }
};
function linkN(w){ return w.slice(0,-1) + oral(w.slice(-1)) + "n"; }
function nameFinalOk(w){ const l = w.toLowerCase(); return /[aeiouüãĩõ]$/.test(l) || CONS_FINAL.test(l); }
function getNames(){ try{ const a = JSON.parse(ls.get(NAMES_KEY)||"[]"); return Array.isArray(a)?a:[]; }catch(e){ return []; } }
function addName(n){ const a = getNames().filter(x=>x!==n); a.unshift(n); ls.set(NAMES_KEY, JSON.stringify(a.slice(0,20))); }

/* ---------- lexicon ---------- */
let LEX = null, LEXSRC = "", NOUNS = [], VERBS = [];
const NOT_NOUNS = new Set(["hena","dã","mõzo","emose"]);
const NOT_VERBS = new Set(["gu"]);
const DEICTIC = {gono:"today", sunõ:"tomorrow", moke:"yesterday", ãko:"now", toye:"later", ümi:"here", sedo:"there"};
const TIME_DEICTIC = ["gono","sunõ","moke","ãko","toye"];
const PLACE_DEICTIC = ["ümi","sedo"];
const TIME_NAMES = ["lõji","zemi","wasnĩ"];

function cleanGloss(g){ return String(g||"").replace(/\s+,/g,",").replace(/\s+/g," ").trim(); }
function shortGloss(g){ return cleanGloss(g).replace(/^to /i,"").split(/\s[—-]\s/)[0]; }
function useLex(obj, src){
  const L = obj && obj.LEX ? obj.LEX : obj;
  if(!L || typeof L !== "object") throw new Error("No LEX");
  LEX = L; LEXSRC = src; NOUNS = []; VERBS = [];
  for(const [k,v] of Object.entries(L)){
    if(!v || typeof v!=="object") continue;
    if(v.c==="noun" && !NOT_NOUNS.has(k)) NOUNS.push({k, g:cleanGloss(v.g)});
    if(v.c==="verb" && !NOT_VERBS.has(k)) VERBS.push({k, g:cleanGloss(v.g), irr:v.irr||null, adj:v.k==="adjv"});
  }
  const byG = (a,b)=> shortGloss(a.g).toLowerCase().localeCompare(shortGloss(b.g).toLowerCase());
  NOUNS.sort(byG); VERBS.sort(byG);
}
async function loadLex(){
  let ok = false;
  try{
    const r = await fetch(LEX_URL, {cache:"no-store"});
    if(r.ok){ const txt = await r.text(); useLex(JSON.parse(txt), "from the site"); ls.set(CACHE_KEY, txt); ok = true; }
  }catch(e){}
  if(!ok){ const c = ls.get(CACHE_KEY); if(c){ try{ useLex(JSON.parse(c), "saved on this device"); ok = true; }catch(e){} } }
  renderLexPanel(); render();
}
function loadFile(file){
  const fr = new FileReader();
  fr.onload = () => {
    try{ useLex(JSON.parse(fr.result), "loaded from file"); ls.set(CACHE_KEY, fr.result); }
    catch(e){ alert("That file isn't a Lunaji lexicon save."); }
    renderLexPanel(); render();
  };
  fr.readAsText(file);
}
const inLex = k => !!(LEX && LEX[k]);
const glossOf = k => LEX && LEX[k] ? shortGloss(LEX[k].g) : (DEICTIC[k]||k);
function verbBare(k){ const v = LEX && LEX[k]; return v && v.irr && v.irr.bare ? v.irr.bare : k; }

/* Transitivity tag from the Forge: LEX[verb].tr = "i" (no object), "t" (takes an object), "b" (either). */
function getTrans(item){
  if(!item || item.kind!=="word" || !LEX || !LEX[item.lu]) return null;
  return {i:"intr", t:"tr", b:"both"}[LEX[item.lu].tr] || null;
}

/* ---------- pronouns (§3.1, §3.5) ---------- */
const PRONOUNS = [
  {lu:"nuswa", base:"nuswa", en:"I"},
  {lu:"lwaji", base:"lwaji", en:"you"},
  {lu:"nwoli", base:"nwoli", en:"he / she", animate:true},
  {lu:"luswazo", base:"luswazo", en:"we (you and me)"},
  {lu:"nuswata", base:"nuswa", ta:true, en:"we (not you)"},
  {lu:"lwajita", base:"lwaji", ta:true, en:"you (all)"},
  {lu:"nwolita", base:"nwoli", ta:true, en:"they", animate:true},
];

/* ---------- state ---------- */
const blankClause = () => ({kind:"verb", verb:null, past:false, neg:false, can:false, want:false, ongoing:false,
  aspect:"", manner:null, might:"", evid:"", aux:"", auxNeg:false, auxCan:false, auxWant:false, causee:null, frame:false, mightWide:false, vu:false, ato:"", verb2:null, vjoin:"and", neg2:false, dip:null, why:false, trel:"at", word:null, qtype:"statement",
  subj:null, role:"topic", obj:null, time:null, place:null, rel:"at", pred:null, std:null, cmp:"more"});
const blank = () => ({type:"statement", c1:blankClause(), link:"", c2:null, more:[]});
let S = blank();
try{ const s = JSON.parse(ls.get(STATE_KEY)||"null"); if(s && s.c1) { S = Object.assign(blank(), s); S.c1 = Object.assign(blankClause(), s.c1); if(s.c2) S.c2 = Object.assign(blankClause(), s.c2); S.more = Array.isArray(s.more) ? s.more.map(m=>({link:m.link, c:Object.assign(blankClause(), m.c)})) : []; } }catch(e){}
const save = () => ls.set(STATE_KEY, JSON.stringify(S));
const UI = {open:null, det:{}, stack:["c1"]};
const UIKEY = "lunaji-composer-ui";
const UIS = {mode:"simple", hints:true};
try{ Object.assign(UIS, JSON.parse(ls.get(UIKEY)||"{}")); }catch(e){}
const saveUI = () => ls.set(UIKEY, JSON.stringify({mode:UIS.mode, hints:UIS.hints}));
function getP(path){ return path.split(".").reduce((o,k)=>o==null?undefined:o[k], S); }
function setP(path,v){ const ks = path.split("."); let o = S; for(let i=0;i<ks.length-1;i++){ if(o[ks[i]]==null) o[ks[i]] = {}; o = o[ks[i]]; } o[ks[ks.length-1]] = v; }

/* ---------- tokens ---------- */
function P(t, cls, note){ return {t, cls, note}; }
function FW(word, note, trig){
  if(LEX && !inLex(word)) return {pieces:[P("["+word+"]","gap",N.missingFW(word))], gap:true, missing:word};
  return {pieces:[P(word,"part",note)], tail: trig ? {p:word, trig} : null};
}
function gapPiece(item){ return P("["+item.en+"]","gap",N.gap(item.en)); }

function basePieces(item){
  if(item.kind==="gap") return [gapPiece(item)];
  if(item.kind==="pron"){
    const p = PRONOUNS.find(x=>x.lu===item.lu) || {lu:item.lu, base:item.lu};
    if(p.ta && !inLex(p.lu)) return [P(p.base,"root", p.animate?N.nwoli:null), P("ta","part",N.ta)];
    return [P(p.lu,"root", p.animate?N.nwoli:null)];
  }
  if(item.kind==="q") return [P(item.lu,"root", item.lu==="mõzo"?N.mozo:N.emose)];
  if(item.kind==="name") return [P(item.lu,"root",N.name)];
  if(item.kind==="ga"){
    const g = item.ga || {};
    const vt = item.verb ? verbToken(item.verb, {vu:g.vu, bi:g.bi, du:g.du, neg:g.neg}) : {pieces:[]};
    return [...vt.pieces, P("ga","part",N.ga)];
  }
  return [P(item.lu,"root",null)];
}

// head word with suffixes and a particle ("topic"|"ba"|"ni"|"wa"|"di"|"pe"|null)
function headToken(item, mods, particle){
  const pcs = basePieces(item);
  const m = mods || {};
  if(item.kind!=="pron" && item.kind!=="q"){
    if(m.jo) pcs.push(P("jo","part",N.jo));
    if(m.ta) pcs.push(P("ta","part", m.jo ? N.ta+" -jo comes before -ta: mumãjota (§2.1a)." : N.ta));
  }
  const tok = {pieces:pcs, gap:item.kind==="gap"};
  if(!particle) return tok;
  if(item.kind==="gap" && pcs.length===1){
    if(particle==="topic") pcs.push(P("·na/a","part","Topic. Its shape — na or a — depends on how the missing word ends (§1b.3)."));
    else pcs.push(P(particle,"part",N[particle]));
    return tok;
  }
  const last = pcs[pcs.length-1], w = last.t, fin = w.slice(-1).toLowerCase();
  if(particle==="topic"){
    if(isNasal(fin)){ last.t = w.slice(0,-1)+oral(fin); pcs.push(P("na","part",N.topicLinkN(w))); return tok; }
    if(pcs.length===1 && item.kind!=="pron" && CONS_FINAL.test(w.toLowerCase())){ pcs.push(P("a","part",N.topicLinkC(w))); return tok; }
    pcs.push(P("na","part",N.topicNa)); tok.tail = {p:"na", trig:"a"}; return tok;
  }
  pcs.push(P(particle,"part", particle==="pe" && item.kind==="q" ? N.mozope : N[particle]));
  tok.tail = {p:particle, trig: particle==="pe" ? ANY : particle.slice(-1)};
  return tok;
}

function numberWord(n){
  const U = ["","zo","vã","ki","ra","bai","baizo","baivã","baiki","baira"];
  if(n===0) return {word:"zero", parts:["zero"]};
  if(n<10) return {word:U[n], parts:[U[n]]};
  if(n===10) return {word:"gõte", parts:["gõte"]};
  const t = Math.floor(n/10), u = n%10, parts = [];
  if(t>1) parts.push(U[t]); parts.push("gõte"); if(u) parts.push(U[u]);
  return {word:parts.join(""), parts};
}
function numberToken(num){
  if(num.q){
    const ctr = num.ctr==="ko" ? "ko" : "re", w = ctr==="ko" ? "emose" : "mõzo";
    return {pieces:[P(w,"root",N.howMany), P(ctr,"part",N[ctr])]};
  }
  const n = Math.max(0, Math.min(99, parseInt(num.n,10)||0));
  const w = numberWord(n);
  const miss = w.parts.filter(p=>LEX && !inLex(p));
  if(miss.length) return {pieces:[P("["+w.word+"]","gap",N.missingFW(miss.join(", ")))], gap:true};
  if(n===0) return {pieces:[P("zero","root",N.zero)]};
  const ctr = num.ctr==="ko" ? "ko" : "re";
  return {pieces:[P(w.word,"root",N.num(n)), P(ctr,"part",N[ctr])]};
}
function descToken(item, note){
  if(item.kind==="gap") return {pieces:[gapPiece(item)], gap:true};
  return {pieces:[P(verbBare(item.lu),"root",note)]};
}

// a noun phrase: modifiers, head, and/or list, particle on the last word
function np(item, particle){
  const res = {tokens:[], nc:[], notes:[]};
  const T = res.tokens;
  const checkName = x => { if(x && x.kind==="name" && !nameFinalOk(x.lu)) res.nc.push(/y$/i.test(x.lu)
      ? `A name's final y sound is spelled i (§2): ${x.lu.slice(0,-1)}i. Pick the name again to use that spelling.`
      : `Grammar.md doesn't say how a particle joins a name ending in “${x.lu.slice(-1)}”. Names ending in a vowel, a nasal vowel (ã ĩ õ) or r, l, s, z, sh are covered. How a name is spelled in Lunaji is TOOL Forge Edits' (Lexicology §4).`); };
  checkName(item);
  if(item.kind==="clause"){
    const cl = item.clause;
    if(!cl || !clauseReady(cl)){ res.nc.push("Finish the clause that goes with yeti."); return res; }
    const rc = buildClause(cl, {type:"statement", main:false, matrix:false, sub:"yeti"});
    res.nc.push(...rc.nc); T.push(...rc.tokens);
    if(particle==="topic"){ res.nc.push("A yeti clause as the topic isn't written in Grammar.md."); return res; }
    const yt = FW("yeti", N.yeti);
    if(particle && !yt.gap){ yt.pieces.push(P(particle,"part",N[particle])); yt.tail = {p:particle, trig:particle.slice(-1)}; }
    T.push(yt);
    if(rc.qCount) res.notes.push(N.yetiQ);
    return res;
  }
  const m = item.mods || {};
  const canMod = ["word","name","gap","ga"].includes(item.kind);
  if(canMod){
    if(m.num && m.ta) res.nc.push("A counted noun never takes -ta: counter and -ta don't go together (§7).");
    if(m.pos){ checkName(m.pos); const pt = headToken(m.pos, null, "pe"); if(item.kind==="ga"){ const pp = pt.pieces[pt.pieces.length-1]; if(pp.cls==="part") pp.note = N.gaPe; } T.push(pt); }
    if(m.dem) T.push(FW("na", N.dem, ANY));
    if(m.num) T.push(numberToken(m.num));
    if(m.relc){
      const rcl = m.relc;
      if(!rcl.verb) res.nc.push("Pick the verb for the clause before the noun, or remove it.");
      else {
        const rc = buildClause(rcl, {type:"statement", main:false, matrix:false, sub:"rel"});
        res.nc.push(...rc.nc);
        if(rc.qCount) res.nc.push("A question word inside a clause before a noun isn't covered by Grammar.md.");
        T.push(...rc.tokens); res.notes.push(N.rel);
      }
    }
    if(m.desc) T.push(m.desc.vu && m.desc.kind==="word" ? {pieces:[P(m.desc.lu,"root",N.desc), P("vu","end",N.vu)]} : descToken(m.desc, N.desc));
  }
  const extra = (canMod && m.join && m.join.items) ? m.join.items : [];
  extra.forEach(checkName);
  if(!extra.length){ T.push(headToken(item, canMod?m:null, particle)); return res; }
  const all = [item, ...extra];
  if(m.join.type==="or"){
    if(all.length>2) res.nc.push("puso joining more than two things isn't written in Grammar.md.");
    T.push(headToken(item, m, null)); T.push(FW("puso", N.puso, "o")); T.push(headToken(extra[0], null, particle));
    return res;
  }
  all.forEach((x,i)=>{
    const last = i===all.length-1;
    if(last){ T.push(FW("fa", N.fa, "a")); T.push(headToken(x, null, particle)); return; }
    const tok = headToken(x, i===0?m:null, null);
    if(i < all.length-2){ tok.after = ","; tok.pieces.push(P(",","comma",N.comma)); }
    T.push(tok);
  });
  return res;
}
function npEn(item){
  if(!item) return "";
  if(item.kind==="clause") return "that… (clause)";
  if(item.kind==="quote") return "“…”";
  const m = item.mods||{}; let s = item.en;
  if(m.desc) s = m.desc.en.replace(/^be /,"")+" "+s;
  if(m.num) s = (m.num.n||0)+" "+s;
  if(m.dem) s = "that "+s;
  if(m.pos) s = m.pos.en+"'s "+s;
  if(m.ta) s += " (plural)";
  if(m.jo) s += " (dear)";
  if(m.join && m.join.items && m.join.items.length) s += " "+m.join.type+" "+m.join.items.map(x=>x.en).join(", ");
  return s;
}

/* ---------- verbs ---------- */
function regularForm(k, past, neg){
  let s = k, link = false;
  if(neg){ if(isNasal(k.slice(-1))){ s = linkN(k); link = true; } s += "ena"; }
  if(past) s += "ze";
  return {s, link};
}
function verbToken(item, o){
  if(item.kind==="gap"){
    const pcs = [gapPiece(item)];
    for(const [f,t,n] of [["vu","+vu",N.vu],["bi","+bi",N.bi],["du","+du",N.du],["ri","+ri",N.ri],["neg","+ena","Not (§4.3). How it joins depends on how the missing verb ends."],["past","+ze",N.ze]])
      if(o[f]) pcs.push(P(t,"end",n));
    return {pieces:pcs, gap:true};
  }
  const k = item.lu, v = (LEX&&LEX[k]) || {}, irr = v.irr;
  if(!(o.bi||o.du||o.ri||o.vu)){
    const slot = o.neg && o.past ? "enaze" : o.neg ? "ena" : o.past ? "ze" : "bare";
    const reg = regularForm(k, o.past, o.neg);
    if(irr && irr[slot] && irr[slot] !== reg.s){
      const why = slot==="bare"
        ? `Irregular (§4.12): the bare form of ${k} is ${irr.bare}. Learned, not worked out.`
        : `Irregular (§4.12): ${irr[slot]}, not ${reg.s}. Learned, not worked out.`;
      return {pieces:[P(irr[slot],"end irr",why)], irr:true};
    }
    const pcs = [];
    if(o.neg && reg.link) pcs.push(P(linkN(k),"root",N.linkVerb(k))); else pcs.push(P(k,"root",null));
    if(o.neg) pcs.push(P("ena","end",N.ena));
    if(o.past) pcs.push(P("ze","end",N.ze));
    return {pieces:pcs};
  }
  const rootNote = k==="yozu" ? "yozu: the full stem of yu, kept before -ri, -bi and -du (§4.12)."
    : irr ? `${k} is irregular, but these endings go on its base form and stay regular (§4.12).` : null;
  const pcs = [P(k,"root",rootNote)];
  if(o.vu) pcs.push(P("vu","end", N.vu + (/vu$/.test(k) ? N.vuVu : "")));
  if(o.bi) pcs.push(P("bi","end",N.bi));
  if(o.du) pcs.push(P("du","end", /du$/.test(k)&&!o.bi ? N.du+" On a verb that ends in -du the syllable doubles; legal, and a watch item (§4.10, §8)." : N.du));
  if(o.ri) pcs.push(P("ri","end",N.ri));
  if(o.neg) pcs.push(P("ena","end",N.ena));
  if(o.past) pcs.push(P("ze","end",N.ze));
  return {pieces:pcs};
}

/* ---------- clauses ---------- */
const isQ = x => x && x.kind==="q";
function qIn(item){ if(!item) return 0; let n = isQ(item)?1:0; if(item.mods && isQ(item.mods.pos)) n++; if(item.mods && item.mods.num && item.mods.num.q) n++; return n; }

function buildClause(c, o){
  const r = {tokens:[], built:[], notes:[], nc:[], warns:[], qCount:0, hasTopic:false, question:false, verbTok:null};
  if(c.kind==="word") buildWord(c,o,r);
  else if(c.kind==="is") buildIs(c,o,r);
  else if(c.kind==="compare") buildCompare(c,o,r);
  else buildVerb(c,o,r);
  return r;
}
function addNP(r, item, particle, en){
  const x = np(item, particle);
  r.tokens.push(...x.tokens); r.nc.push(...x.nc); r.notes.push(...x.notes);
  if(en) r.built.push(en);
}

function buildVerb(c,o,r){
  const T = r.tokens, B = r.built;
  const type = o.main ? o.type : "statement";
  const cmd = type==="command", lets = type==="lets";
  const subj = (cmd||lets) ? null : c.subj;
  let role = c.role;
  if(subj){ if(isQ(subj)) role = "doer"; if(role==="drop" && subj.kind!=="pron") role = "topic"; }
  if(subj && o.sub && role==="topic"){ role = "doer"; r.notes.push("No topic inside a subordinate clause, so its subject takes ba (§6.2)."); }
  r.qCount = qIn(subj)+qIn(c.obj)+qIn(c.time)+qIn(c.place)+qIn(c.causee)+qIn(c.dip)+(c.why?1:0);
  const neg = c.neg || c.ato==="never";
  const quote = c.obj && c.obj.kind==="quote" ? c.obj : null;

  if(cmd && c.past) r.nc.push("A command is the bare verb (§4.5), so it has no past form.");
  if(cmd && (c.aspect||c.can||c.want||c.ongoing||c.might||c.evid||c.aux||c.vu||c.ato)) r.nc.push("A command is the bare verb (§4.5). A command with can, want, -vu, an aspect, ãto, might, a source word or make/let isn't written in Grammar.md.");
  if(lets && (c.past||c.neg||c.can||c.want||c.ongoing||c.aspect||c.might||c.evid||c.aux||c.manner||c.vu||c.ato)) r.nc.push("Let's is luswazo + the bare verb (§4.10). Anything added to the verb isn't written in Grammar.md.");
  if(r.qCount>1) r.nc.push("Two question words in one sentence isn't covered by Grammar.md.");
  if((cmd||lets) && r.qCount) r.nc.push("A question word in a command or a let's isn't covered by Grammar.md.");
  if(c.verb2 && (c.can||c.want||c.ongoing||c.vu||c.aux||c.ato||c.aspect||c.manner)) r.nc.push("When fa or puso joins two verbs, Grammar.md places the past (on the last verb) and -ena (on each verb it negates), but not the other endings, ãto, an aspect, a how-word or make / let (§6.0).");
  if(quote && !(c.verb.kind==="word" && c.verb.lu==="onu")) r.nc.push("A quotation is closed by onu, to say (§4.9). Pick onu as the verb.");
  if(quote && quote.clause && !clauseReady(quote.clause)) r.nc.push("Finish the quoted sentence.");
  if(c.might==="cant" && neg) r.nc.push("oyã hena with a negative verb isn't written in Grammar.md.");
  if(c.evid && !o.matrix) r.nc.push("la, po and ke go only in the main clause (§6.2).");
  if(o.sub && c.might) r.nc.push("oyã inside a subordinate clause isn't written in Grammar.md.");

  // make / let: the causee's particle
  let cp = null;
  if(c.aux){
    if(!c.causee) r.nc.push("Add who is being made or let to do it (§4.10).");
    else {
      const tr0 = getTrans(c.verb);
      if(tr0==="intr" && c.obj) r.nc.push("This verb is tagged as taking no object, so under make / let the one acting takes ni, and an object would take ni too. That isn't covered: remove the object or pick another verb (§4.10).");
      else if(tr0==="intr") cp = "ni";
      else if(tr0==="tr" || tr0==="both") cp = "di";
      else if(c.verb.kind==="gap") r.nc.push("Under make / let, ni or di depends on whether the verb can take an object (§4.10). A missing verb has no tag yet.");
      else r.nc.push("Under make / let, ni or di depends on whether the verb can take an object (§4.10). This verb has no tag in the lexicon.");
    }
  }
  const nDi = (cp==="di" ? 1 : 0) + (c.dip ? 1 : 0) + (c.why ? 1 : 0);
  if(nDi>1) r.nc.push("Two di phrases of a person, tool or cause in one clause (with / by / about, how / why, or the one made or let to act): their order isn't written in Grammar.md. A di of place is fine beside one (§5.2).");
  const tr = getTrans(c.verb);
  if(c.obj && tr==="intr" && !c.aux) r.warns.push(`${c.verb.en} is tagged in the lexicon as taking no object, but an object is filled in.`);
  if(c.aux && c.obj && tr==="intr") r.warns.push(`${c.verb.en} is tagged in the lexicon as taking no object, but an object is filled in.`);
  if(r.nc.length) return;

  const cap = fn => { const keep = r.tokens; r.tokens = []; fn(); const got = r.tokens; r.tokens = keep; return got; };
  let quoteToks = [];
  if(quote){
    const qc = quote.clause;
    const inner = buildClause(qc, {type: qc.qtype || "statement", main:true, matrix:true});
    r.nc.push(...inner.nc);
    if(!inner.nc.length && inner.tokens.length){
      quoteToks = inner.tokens;
      quoteToks[0].pieces.unshift(P("“","punct",N.quote));
      const lt = quoteToks[quoteToks.length-1];
      lt.pieces.push(P((inner.question?"?":"")+"”","punct",null)); lt.tail = null;
      B.push("“"+inner.built.join(" · ")+"”");
    }
  }
  const mightToks = cap(()=>{ if(!c.might) return; r.tokens.push(FW("oyã", c.might==="cant"?N.oyaHena:N.oya)); if(c.might==="cant") r.tokens.push(FW("hena", N.oyaHena)); B.push(c.might==="cant"?"can't be":"might"); });
  const topicToks = cap(()=>{
    if(lets){ r.tokens.push({pieces:[P("luswazo","root",N.luswazo)]}); B.push("let's (we)"); }
    if(subj && role==="topic"){ addNP(r, subj, "topic", npEn(subj)+" (topic)"); r.hasTopic = true; }
  });
  let placeTo = null;
  const frameToks = cap(()=>{
    const Tf = r.tokens;
    if(c.time){
      const x = c.time;
      if(isQ(x)){ Tf.push({pieces:[P("emose","root",N.emose), P("wa","part",N.emosewa)], tail:{p:"wa",trig:"a"}}); B.push("when?"); }
      else if(c.trel==="from"||c.trel==="until"){
        if(x.kind==="word" && DEICTIC[x.lu]) Tf.push({pieces:[P(x.lu,"root",null)]}); else addNP(r, x, null);
        Tf.push(c.trel==="from" ? FW("toma",N.timeToma) : FW("rowo",N.timeRowo)); B.push((c.trel==="from"?"from ":"until ")+npEn(x));
      }
      else if(x.kind==="word" && DEICTIC[x.lu]){ Tf.push({pieces:[P(x.lu,"root",N.deictic(x.lu))]}); B.push(x.en); }
      else addNP(r, x, "wa", "at "+npEn(x));
    }
    if(c.place){
      const x = c.place;
      if(isQ(x) && x.fixed==="wa"){ Tf.push({pieces:[P("emose","root",N.emose), P("wa","part",N.emosewa)], tail:{p:"wa",trig:"a"}}); B.push("where?"); }
      else if(isQ(x) && x.fixed==="toma"){ Tf.push({pieces:[P("emose","root",N.emose)]}); Tf.push(FW("toma",N.emoseToma)); B.push("from where?"); }
      else if(c.rel==="from"){ addNP(r, x, null); Tf.push(FW("toma",N.toma)); B.push("from "+npEn(x)); }
      else if(c.rel==="to"){ addNP(r, x, "di", "to "+npEn(x)); markLast(Tf, N.di+" A di of place or direction stands in the place slot (§5.2)."); }
      else if(x.kind==="word" && DEICTIC[x.lu]){ Tf.push({pieces:[P(x.lu,"root",N.deictic(x.lu))]}); B.push(x.en); }
      else addNP(r, x, "wa", "at "+npEn(x));
    }
  });
  const hasFront = r.hasTopic || lets;
  const frameFirst = !!(c.frame && hasFront && frameToks.length);
  let lead;
  if(o.hasSub){
    const wide = !!(c.might && c.mightWide);
    if(wide && !r.hasTopic) r.nc.push("With no main-clause topic, anything before the "+o.hasSub+" part belongs to it (§6.1a), so oyã can't go there to doubt the whole if-then.");
    const pre = r.hasTopic ? [...frameToks, ...topicToks, ...(wide ? mightToks : [])] : [];
    lead = r.hasTopic ? [...pre, ...(wide ? [] : mightToks)] : [...mightToks, ...frameToks];
    r.topicLen = pre.length;
    r.notes.push(r.hasTopic
      ? "With an if / when / because part, the neutral order is: when / where → topic → the "+o.hasSub+" part → oyã → the rest → verb (§6.1a)."
      : "A time or place word stays in its own clause. With no main-clause topic, anything before the "+o.hasSub+" part would belong to it, so the main clause's when / where comes after it (§6.1a).");
    if(c.might) r.notes.push(wide ? "oyã before the "+o.hasSub+" part doubts the whole if-then (§6.1a)." : "oyã after the "+o.hasSub+" part doubts the main clause only (§6.1a).");
  }
  else if(!hasFront){ lead = [...mightToks, ...frameToks]; r.topicLen = 0; }
  else if(frameFirst){ lead = [...frameToks, ...topicToks, ...mightToks]; r.topicLen = 0; r.notes.push("When / where stands before the topic as the frame (§5.2)."); }
  else { lead = [...topicToks, ...mightToks, ...frameToks]; r.topicLen = topicToks.length; }
  if(quoteToks.length){ lead = [...quoteToks, ...lead]; r.topicLen = r.topicLen ? r.topicLen + quoteToks.length : 0; }
  if(c.might && r.hasTopic && !o.hasSub) r.notes.push("oyã stands right after the topic: the topic is outside what is doubted (§5.3).");
  if(subj && role==="doer"){
    const before = T.length;
    addNP(r, subj, "ba", npEn(subj)+" (does it)");
    if(isQ(subj)){ const tk = T[T.length-1]; tk.pieces[tk.pieces.length-1].note = N.ba+" "+N.qForceBa; }
    void before;
  }
  if(c.dip){ addNP(r, c.dip, "di", (c.vu?"by ":"to / with ")+npEn(c.dip)); markLast(T, c.vu ? N.dipVu : N.dip); }
  if(c.why){ T.push({pieces:[P("emose","root",N.emose), P("di","part",N.emosedi)], tail:{p:"di",trig:"i"}}); B.push("how / why?"); }
  if(c.aux && cp==="di"){ addNP(r, c.causee, "di", npEn(c.causee)+" (made/let to act)"); markLast(T, N.causeeDi); }
  if(c.obj && !quote) addNP(r, c.obj, "ni", npEn(c.obj)+" (object)");
  if(c.aux && cp==="ni"){ addNP(r, c.causee, "ni", npEn(c.causee)+" (made/let to act)"); markLast(T, N.causeeNi); }

  if(c.ato){
    if(LEX && !inLex("ãto")) T.push({pieces:[P("[ãto]","gap",N.missingFW("ãto"))], gap:true, missing:"ãto"});
    else T.push({pieces:[P("ãto","root", c.ato==="never" ? N.atoNever : N.ato)]});
    B.push(c.ato);
  }
  if(c.aspect){ T.push(FW(c.aspect, N[c.aspect], ANY)); B.push(c.aspect==="ila"?"has (done)":"habitually"); }
  if(c.manner){ T.push(descToken(c.manner, N.manner)); B.push(c.manner.en+" (how)"); }

  const vpast = cmd ? false : c.past;
  const vt = verbToken(c.verb, {vu:c.vu, bi:c.can, du:c.want, ri:c.ongoing, neg, past: (c.aux || c.verb2) ? false : vpast});
  T.push(vt); r.verbTok = vt;
  B.push((neg&&c.ato!=="never"?(cmd?"don't ":"not "):"")+(c.can?"can ":"")+(c.want?"want to ":"")+c.verb.en+(c.vu?" (state, -vu)":"")+(c.ongoing?" (ongoing)":"")+(vpast&&!c.aux&&!c.verb2?" (past)":""));
  if(c.verb2){
    T.push(c.vjoin==="or" ? FW("puso", N.verbPuso, "o") : FW("fa", N.verbFa, "a"));
    const v2 = verbToken(c.verb2, {neg:c.neg2, past:vpast}); T.push(v2); r.verbTok = v2;
    B.push((c.vjoin==="or"?"or ":"and ")+(c.neg2?"not ":"")+c.verb2.en+(vpast?" (past)":""));
    if(vpast) r.notes.push("Two verbs joined by fa or puso share the last verb's past ending; -ena goes on each verb it negates (§6.0). Different tenses need two clauses with mishi.");
  }

  if(c.aux){
    const ak = c.aux;
    if(LEX && !inLex(ak)) T.push({pieces:[P("["+ak+"]","gap",N.missingFW(ak))], gap:true});
    else {
      const at = verbToken({kind:"word", lu:ak, en:ak}, {bi:c.auxCan, du:c.auxWant, neg:c.auxNeg, past:vpast});
      at.pieces[0].note = (at.pieces[0].note ? at.pieces[0].note+" " : "") + (ak==="tsobã"?N.tsoba:N.idovu);
      T.push(at); r.verbTok = at;
    }
    B.push((c.auxNeg?"not ":"")+(c.auxCan?"can ":"")+(c.auxWant?"want to ":"")+(ak==="tsobã"?"make":"let")+(vpast?" (past)":""));
  }
  if(c.evid && o.matrix){ T.push(FW(c.evid, N[c.evid])); B.push({la:"heard/felt",po:"it seems",ke:"I assume"}[c.evid]); }

  if(o.matrix){
    if(r.qCount) r.question = true;
    else if(type==="question"){ r.question = true; T.push(FW("jĩ", N.jin)); B.push("?"); }
  }
  // notes
  if(subj && c.role==="drop" && subj.kind==="pron") r.notes.push(`"${subj.en}" is left out: a neutral sentence has no pronoun in it (§2.3).`);
  if(cmd) r.notes.push(c.neg ? "A command is the bare verb; with -ena it means don't (§4.5)." : "A command is the bare verb, with no subject (§4.5).");
  if(!cmd && !lets && !c.past && c.verb.kind!=="gap") r.notes.push("No -ze, so the verb is non-past: it covers now and later (§4.1).");
  if(c.verb.kind==="word" && ["hi","yozu","ĩku"].includes(c.verb.lu)) r.notes.push("Being there: hi for something that moves or makes sound on its own, yu for what doesn't, ĩku when something acted and you can't tell what (§4.7). X-ba hi: there's an X. X-na hi: the X is here (§4.7a). Owner-pe X-ba hi / yu: the owner has an X (§3.3b).");
  if(quote) r.notes.push(N.quote);
  if(c.aux) r.notes.push("With make or let, the past goes on the last verb, and -ena goes on whichever verb it negates (§4.10, §4.3).");
  if(lets && (c.obj||c.time||c.place)) r.notes.push("Let's: luswazo, bare, opens the clause, and the rest follows the neutral order (§4.10).");
  r.tokens = lead.concat(r.tokens);
}

function markLast(T, note){ const tk = T[T.length-1]; const p = tk.pieces[tk.pieces.length-1]; if(p.cls==="part") p.note = note; }

function buildIs(c,o,r){
  const T = r.tokens, B = r.built, type = o.main ? o.type : "statement";
  if(type==="command"||type==="lets") r.nc.push("A command or let's built on \"is\" isn't written in Grammar.md.");
  if(o.sub){
    if(o.sub!=="if") { /* reported once, by compose */ }
    else if(c.subj) r.nc.push("An \"if it is / isn't…\" clause has no topic, so its X can't be said: §6.1a writes only Noa henana and Noa guenazena.");
    else if(!c.past && !c.neg) r.nc.push("\"If it is…\" in the present isn't written in Grammar.md: there's no copula word for the if-particle to join. §6.1a writes only the negative (Noa henana) and the past (Noa guenazena).");
  }
  r.qCount = qIn(c.subj)+qIn(c.pred);
  const qPred = isQ(c.pred) && !(c.pred.mods && c.pred.mods.pos);
  const qSubj = isQ(c.subj);
  if((c.pred && c.pred.mods && isQ(c.pred.mods.pos)) || (c.subj && c.subj.mods && isQ(c.subj.mods.pos))) r.nc.push("\"Whose\" in an \"X is Y\" sentence isn't written in Grammar.md.");
  if(qPred && qSubj) r.nc.push("Two question words in one sentence isn't covered by Grammar.md.");
  if(c.subj && c.role==="doer" && !qSubj) r.nc.push("§4.6 shows \"X is Y\" with X as the topic or left out, not with ba.");
  if(r.nc.length) return;
  if(qSubj){ addNP(r, c.subj, "ba", c.subj.en); markLast(T, "In an \"X is Y\" question, a question word in the first place takes ba (§3.6)."); }
  else if(c.subj && (c.role!=="drop" || c.subj.kind!=="pron")){ addNP(r, c.subj, "topic", npEn(c.subj)+" (topic)"); r.hasTopic = true; r.topicLen = r.tokens.length; }
  if(qPred){ r.tokens.push({pieces:[P(c.pred.lu,"root",(c.pred.lu==="mõzo"?N.mozo:N.emose).replace(/It stays.*$/,"")+" In an \"X is Y\" question it stands bare in the second place, with no jĩ (§3.6).")]}); B.push(c.pred.en); }
  else addNP(r, c.pred, null, "is "+npEn(c.pred));
  if(c.past){
    if(LEX && !inLex("gu")) T.push({pieces:[P("[gu]","gap",N.missingFW("gu"))], gap:true});
    else { const pcs = [P("gu","root",N.gu)]; if(c.neg) pcs.push(P("ena","end",N.guNeg)); pcs.push(P("ze","end",N.ze)); const gt = {pieces:pcs}; T.push(gt); r.verbTok = gt; }
    B.push(c.neg?"wasn't":"was");
  } else if(c.neg){ const ht = FW("hena", o.sub ? "hena — not, standing free: there's no verb in a present \"X is Y\" clause (§4.3)." : N.henaFree); T.push(ht); r.verbTok = ht; B.push("not"); }
  if(o.matrix && (qPred || qSubj)) r.question = true;
  else if(o.matrix && type==="question"){ r.question = true; T.push(FW("jĩ", N.jin)); }
  if(!c.past) r.notes.push("No word for \"is\" now: the copula is zero when it isn't past (§4.6).");
  if(o.sub) r.notes.push(c.past ? "In the past the copula carries the if-particle: guenazena, if it wasn't (§6.1a)." : "Free henana: if it isn't. It survives only here, in a present \"X is Y\" clause (§6.1a).");
  if(c.subj && c.role==="drop" && c.subj.kind==="pron") r.notes.push(`"${c.subj.en}" is left out: a neutral sentence has no pronoun in it (§2.3).`);
}

function buildCompare(c,o,r){
  const T = r.tokens, B = r.built, type = o.main ? o.type : "statement";
  if(type==="command"||type==="lets") r.nc.push("A command or let's that compares isn't written in Grammar.md.");
  if(o.sub) r.nc.push("A comparison inside an if / when / because clause isn't covered yet.");
  r.qCount = qIn(c.subj)+qIn(c.std);
  if(r.qCount) r.nc.push("A question word in a comparison isn't written in Grammar.md.");
  if(c.role==="drop") r.nc.push("§5.4 shows the thing compared with ba or as the topic, not left out.");
  if(r.nc.length) return;
  const topic = c.role==="topic";
  addNP(r, c.subj, topic?"topic":"ba", npEn(c.subj)+(topic?" (topic)":""));
  r.hasTopic = topic; r.topicLen = topic ? r.tokens.length : 0;
  if(c.cmp==="as"){ addNP(r, c.std, null); T.push(FW("uã", N.ua)); B.push("as "+npEn(c.std)); }
  else { T.push(FW("kügi", N.kugi, ANY)); addNP(r, c.std, null); B.push("than "+npEn(c.std)); }
  T.push(verbToken(c.verb, {neg:c.neg, past:c.past}));
  B.push((c.neg?"not ":"")+(c.cmp==="as"?"as ":"more ")+c.verb.en+(c.past?" (past)":""));
  if(o.matrix && type==="question"){ r.question = true; T.push(FW("jĩ", N.jin)); }
  r.notes.push(c.cmp==="as" ? "As … as: A-ba, then B, then uã, then the describing verb (§5.4)." : "Comparing: A-ba, then kügi and B, then the describing verb (§5.4). There's no word for \"most\" (§5.4).");
}

function buildWord(c,o,r){
  const type = o.main ? o.type : "statement";
  if(type!=="statement") r.nc.push("A one-word sentence is a plain statement (§2.4a); a question, command or let's with it isn't written in Grammar.md.");
  if(o.sub || !o.main) r.nc.push("A one-word sentence can't be joined to another clause.");
  if(isQ(c.word)) r.nc.push("A question word on its own isn't written in Grammar.md.");
  if(r.nc.length) return;
  const x = np(c.word, null); r.tokens.push(...x.tokens); r.nc.push(...x.nc); r.notes.push(...x.notes);
  const last = r.tokens[r.tokens.length-1];
  if(c.word.kind==="word" && ["dã","hena"].includes(c.word.lu)) last.pieces[0].note = c.word.lu==="dã" ? "dã — yes: agreement, acknowledgement, compliance (§6.3)." : "hena on its own is a standalone no (§6.3).";
  else r.notes.push(N.bare);
  r.built.push(npEn(c.word));
}

function clauseReady(c){
  if(!c) return false;
  if(c.kind==="word") return !!c.word;
  if(c.kind==="is") return !!c.pred;
  if(c.kind==="compare") return !!(c.subj && c.std && c.verb);
  return !!c.verb;
}

/* ---------- compose the sentence ---------- */
const SUBS = ["if","when","because","since","until"];
function compose(){
  const out = {tokens:[], notes:[], nc:[], warns:[], built:[], gaps:[], question:false, ready:false, answers:null};
  const t = S.type, c1 = S.c1, link = S.link, c2 = link ? S.c2 : null;
  const sub = !!c2 && SUBS.includes(link);
  const chain = (!sub && c2 && Array.isArray(S.more)) ? S.more.filter(m=>m && m.c) : [];
  if(!clauseReady(c1)){ out.wait = c1.kind==="is" ? "Pick what it is." : c1.kind==="compare" ? "Pick who, compared with whom, and the describing word." : "Pick a verb to start."; return out; }
  if(c2 && !clauseReady(c2)){ out.wait = "Finish the second clause, or remove it."; return out; }
  if(chain.some(m=>!clauseReady(m.c))){ out.wait = "Finish every added clause, or remove it."; return out; }

  const A = buildClause(c1, {type:t, main:true, matrix: !c2 || sub, hasSub: sub ? link : ""});
  const Bc = c2 ? buildClause(c2, {type:"statement", main:false, matrix:false, sub: sub ? link : null}) : null;
  out.nc.push(...A.nc); if(Bc) out.nc.push(...Bc.nc);
  out.warns.push(...A.warns); if(Bc) out.warns.push(...Bc.warns);
  const More = chain.map(m=>buildClause(m.c, {type:"statement", main:false, matrix:false}));
  More.forEach(x=>{ out.nc.push(...x.nc); out.warns.push(...x.warns); });

  if(c2){
    if(t==="lets") out.nc.push("Let's with a second clause isn't written in Grammar.md.");
    if(!sub && t==="command") out.nc.push("A command joined with mishi or norõ isn't written in Grammar.md.");
    if(!sub && (t==="question" || A.qCount || (Bc&&Bc.qCount) || c1.evid || c2.evid || More.some(x=>x.qCount) || chain.some(m=>m.c.evid))) out.nc.push("A question, or la / po / ke, in two clauses joined by mishi or norõ isn't written in Grammar.md.");
    if(sub && c2.kind!=="verb" && !(c2.kind==="is" && link==="if")) out.nc.push("This part needs a verb. An \"X is Y\" part is written only with if (§6.1a).");
    if(sub && Bc && Bc.qCount) out.nc.push("A question word in an if / when / because clause isn't covered.");
  }
  if(out.nc.length) return out;

  let T = [];
  if(sub){
    const vt = Bc.verbTok, last = vt.pieces[vt.pieces.length-1];
    if(link==="if"){
      const w = last.t, fin = w.slice(-1);
      if(!vt.gap && isNasal(fin)){ last.t = w.slice(0,-1)+oral(fin); vt.pieces.push(P("na","part",N.ifLink(w))); }
      else { vt.pieces.push(P("na","part",N.ifNa)); vt.tail = {p:"na", trig:"a"}; }
    } else if(link==="when"){ vt.pieces.push(P("wa","part",N.whenWa)); vt.tail = {p:"wa", trig:"a"}; }
    else if(link==="because"){ vt.pieces.push(P("di","part",N.becauseDi)); vt.tail = {p:"di", trig:"i"}; }
    else Bc.tokens.push(link==="since" ? FW("toma", N.sinceToma) : FW("rowo", N.untilRowo));
    const tl = A.topicLen || 0;
    T = [...A.tokens.slice(0,tl), ...Bc.tokens, ...A.tokens.slice(tl)];
    if(tl) out.notes.push("A noun topic may stand before the "+link+" part (§6.1a). The part first is legal too; there's no topic inside it.");
    out.built = [link+": "+Bc.built.join(" · "), ...A.built];
    out.notes.push((link==="since"||link==="until") ? "The "+link+" part comes first, with "+(link==="since"?"toma":"rowo")+" after its verb and no comma (§6.1). Each clause has its own negation and tense (§6.2)." : "The "+link+" part comes first, with its particle straight on its verb and no comma (§6.1, §6.1a). Each clause has its own negation and tense (§6.2).");
  } else if(c2){
    const lkTok = l => l==="mishi" ? FW("mishi", N.mishi, "i") : FW("norõ", N.noro);
    T = [...A.tokens, lkTok(link), ...Bc.tokens];
    out.built = [...A.built, link==="mishi"?"and":"but", ...Bc.built];
    chain.forEach((m,i)=>{ T.push(lkTok(m.link), ...More[i].tokens); out.built.push(m.link==="mishi"?"and":"but", ...More[i].built); });
  } else { T = A.tokens; out.built = A.built; }
  out.question = A.question;
  out.notes.push(...A.notes); if(Bc) out.notes.push(...Bc.notes); More.forEach(x=>out.notes.push(...x.notes));
  if(c1.kind==="verb" && T.length>2) out.notes.push("Neutral order: topic → time → place → subject (ba) → di → object (ni) → how → verb. Only the verb's place is fixed: any other order of the noun phrases is legal, and when or where may stand before the topic as the frame (§5.2).");

  // elision (§1b.4, §6, §6.0)
  for(let i=0;i<T.length-1;i++){
    const a = T[i], b = T[i+1];
    if(!a.tail || a.gap || b.gap || a.after) continue;
    const first = b.pieces[0].t.charAt(0);
    if(a.tail.trig.includes(oral(first.toLowerCase()))){
      const pc = a.pieces[a.pieces.length-1];
      const p = a.tail.p;
      pc.t = pc.t.slice(0, pc.t.length - 1) + "'";
      pc.cls = "elide";
      pc.note = `${p} drops its last vowel before the ${first} of the next word and is written joined to it (§1b.4). `+(pc.note||"");
      a.join = true;
    }
  }
  out.tokens = T;
  out.ready = true;

  // gaps
  const KEYS = ["verb","verb2","subj","obj","time","place","manner","causee","pred","std","dip","word"];
  const walkC = c => { if(c) KEYS.forEach(k=>walk(c[k])); };
  const walk = x => { if(!x) return; if(x.kind==="gap") out.gaps.push(x.en); if(x.verb) walk(x.verb); if(x.clause) walkC(x.clause); const m = x.mods||{}; walk(m.pos); walk(m.desc); if(m.relc) walkC(m.relc); (m.join&&m.join.items||[]).forEach(walk); };
  [c1, c2, ...chain.map(m=>m.c)].forEach(walkC);
  for(const tk of T) if(tk.missing) out.gaps.push(tk.missing);

  // answers (§6.3)
  if(out.question && !c2 && c1.kind==="verb" && !c1.aux && !c1.verb2 && !c1.ato && c1.verb.kind==="word"){
    if(A.qCount) out.answers = {text:"Answer a question-word question with just the noun (§6.3)."};
    else if(!c1.neg){
      const asp = c1.aspect ? c1.aspect+" " : "";
      const mk = neg => asp + verbToken(c1.verb, {vu:c1.vu, bi:c1.can, du:c1.want, ri:c1.ongoing, neg, past:c1.past}).pieces.map(p=>p.t).join("");
      const cap = s => s.charAt(0).toUpperCase()+s.slice(1);
      out.answers = {yes:cap(mk(false))+".", no:cap(mk(true))+"."};
    }
  }
  return out;
}

/* ---------- render ---------- */
let pieceIndex = [];
function render(){
  save();
  document.querySelectorAll("#types button").forEach(b=>b.classList.toggle("on", b.dataset.t===S.type));
  renderSlots();
  const c = compose();
  const sEl = $("#sentence"), tip = $("#tip");
  tip.classList.remove("on"); pieceIndex = [];
  $("#ncbox").innerHTML = c.nc.map(m=>`<div class="nc"><b>Not covered.</b> ${esc(m)}</div>`).join("")
    + (c.ready ? c.warns.map(m=>`<div class="nc"><b>Check.</b> ${esc(m)}</div>`).join("") : "");
  $("#answers").innerHTML = "";
  if(!c.ready){
    sEl.innerHTML = `<span class="placeholder">${esc(!LEX ? "Load the lexicon to start." : c.nc.length ? "—" : (c.wait||""))}</span>`;
    $("#built").textContent = "";
  } else {
    let html = "", first = true, quoteOpen = false;
    c.tokens.forEach((tok,ti)=>{
      html += `<span class="w">`;
      tok.pieces.forEach(p=>{
        let t = p.t;
        if(p.cls==="punct"){ html += esc(t); if(p.t==="“") { quoteOpen = true; } return; }
        if((first || quoteOpen) && p.cls!=="gap"){ t = t.charAt(0).toUpperCase()+t.slice(1); }
        first = false; quoteOpen = false;
        if(p.cls==="comma"){ html += ","; return; }
        const idx = pieceIndex.length; pieceIndex.push(p);
        const cls = p.cls.split(" ")[0];
        html += `<span class="pc ${cls}${p.note&&cls==="root"?" noted":""}" data-i="${idx}">${esc(t)}</span>`;
      });
      html += `</span>`;
      if(ti < c.tokens.length-1 && !tok.join) html += " ";
    });
    html += c.question ? "?" : ".";
    sEl.innerHTML = html;
    $("#built").textContent = "Built from: " + c.built.join(" · ");
    if(c.answers){
      $("#answers").innerHTML = c.answers.text ? `<div class="answers">${esc(c.answers.text)}</div>`
        : `<div class="answers">Answer by echoing the verb (§6.3): yes <span class="lu">${esc(c.answers.yes)}</span> · no <span class="lu">${esc(c.answers.no)}</span><br><span style="color:var(--muted);font-size:13px">Also <span class="lu">dã</span>, yes; <span class="lu">hena</span> on its own, no (§6.3).</span></div>`;
    }
  }
  const rows = [];
  if(c.ready){
    const seen = new Set();
    const quoteNote = c.tokens.some(tk=>tk.pieces.some(p=>p.cls==="punct"&&p.note)) ? N.quote : null;
    if(quoteNote) rows.push(`<div class="row"><div class="k lu">“ ”</div><div>${esc(quoteNote)}</div></div>`);
    for(const p of pieceIndex){ if(!p.note) continue; const key = p.t+"|"+p.note; if(seen.has(key)) continue; seen.add(key);
      rows.push(`<div class="row"><div class="k lu"><span class="pc ${p.cls.split(" ")[0]}">${esc(p.t)}</span></div><div>${esc(p.note)}</div></div>`); }
    for(const n of [...new Set(c.notes)]) rows.push(`<div class="row gen"><div class="k">•</div><div>${esc(n)}</div></div>`);
  }
  $("#why").innerHTML = rows.join("") || `<div class="row gen"><div>Build a sentence and each particle and ending is explained here. Tap any piece of the sentence to see why it's there.</div></div>`;
  const gaps = [...new Set(c.gaps)];
  $("#gaps").innerHTML = gaps.length ? `Missing words: ${gaps.map(esc).join(", ")}<button id="copyGaps">Copy</button>` : "";
  const cg = $("#copyGaps");
  if(cg) cg.onclick = () => { try{ navigator.clipboard.writeText(gaps.join("\n")); cg.textContent = "Copied"; }catch(e){} };
}

$("#sentence").addEventListener("click", e=>{
  const el = e.target.closest(".pc"), tip = $("#tip");
  document.querySelectorAll("#sentence .pc.sel").forEach(x=>x.classList.remove("sel"));
  if(!el){ tip.classList.remove("on"); return; }
  const p = pieceIndex[+el.dataset.i]; if(!p) return;
  el.classList.add("sel");
  const g = (p.cls==="root" && LEX && LEX[p.t]) ? ` — ${esc(shortGloss(LEX[p.t].g))}` : "";
  tip.innerHTML = `<b>${esc(p.t)}</b>${g}<br>${esc(p.note || (p.cls==="root" ? "The word itself." : ""))}`;
  tip.classList.add("on");
});

/* ---------- UI: folded slots, clause screens, Simple / Full ---------- */
const isFull = () => UIS.mode==="full";
function valHtml(x, ph){
  if(!x) return `<span class="en">${ph}</span>`;
  if(x.kind==="name") return `<span class="en">${esc(x.en)}</span><span class="luv">name</span>`;
  if(x.kind==="clause") return `<span class="en">that… — a whole clause</span><span class="luv lu">yeti</span>`;
  if(x.kind==="quote") return `<span class="en">“…” — a quotation</span><span class="luv">quote</span>`;
  if(x.kind==="gap") return `<span class="en">${esc(x.en)}</span><span class="luv" style="color:var(--gap)">no word yet</span>`;
  return `<span class="en">${esc(x.en)}</span><span class="luv lu">${esc(x.show||x.lu)}</span>`;
}
const picker = (path, mode, ph) => { const v = getP(path); return `<div class="pick"><button class="val${v?"":" empty"}" data-open="${path}|${mode}">${valHtml(v, ph)}</button>${v?`<button class="x" data-clear="${path}" aria-label="Clear">×</button>`:""}</div>`; };
const tog = (path, label) => `<button data-tog="${path}" class="${getP(path)?"on":""}">${label}</button>`;
const setb = (path, val, label, unset) => `<button data-set="${path}" data-v="${val}"${unset?' data-unset="1"':""} class="${getP(path)===val?"on":""}">${label}</button>`;
const opts = (label, inner, small) => `<div class="opts${small===false?"":" small"}">${label?`<span class="ol">${label}</span>`:""}${inner}</div>`;

function nounSum(x){
  if(!x) return "";
  if(x.kind==="clause") return `that… <i>a clause</i>`;
  if(x.kind==="quote") return `“…” <i>a quotation</i>`;
  const lu = x.kind==="name" ? "" : x.kind==="gap" ? "" : (x.show||x.lu||"");
  return esc(npEn(x)) + (lu ? ` <span class="lu">${esc(lu)}</span>` : "") + (x.kind==="gap" ? ` <span class="tags" style="color:var(--gap)">no word yet</span>` : "");
}
function verbSum(c){
  if(!c.verb) return "";
  const f = [];
  if(c.past) f.push("past"); if(c.neg) f.push("not"); if(c.can) f.push("can"); if(c.want) f.push("want to");
  if(c.ongoing) f.push("ongoing"); if(c.vu) f.push("-vu"); if(c.aspect) f.push(c.aspect); if(c.ato) f.push(c.ato);
  if(c.manner) f.push("how: "+c.manner.en); if(c.might) f.push(c.might==="cant"?"can't be":"might");
  if(c.aux) f.push(c.aux==="tsobã"?"make":"let"); if(c.evid) f.push(c.evid); if(c.why) f.push("how / why?");
  if(c.verb2) f.push((c.vjoin==="or"?"or ":"and ")+c.verb2.en);
  const lu = c.verb.kind==="word" ? verbBare(c.verb.lu) : "";
  return esc(c.verb.en) + (lu?` <span class="lu">${esc(lu)}</span>`:"") + (f.length?` <span class="tags">${esc(f.join(" · "))}</span>`:"");
}
function clauseSum(c){
  if(!c) return "";
  if(c.kind==="is") return c.pred ? (c.neg?"isn't ":"is ")+esc(npEn(c.pred)) : "";
  if(c.kind==="compare") return c.verb ? "compare: "+esc(c.verb.en) : "";
  if(c.kind==="word") return c.word ? esc(npEn(c.word)) : "";
  return c.verb ? esc(c.verb.en)+(c.subj?" — "+esc(npEn(c.subj)):"")+(c.obj?" · "+esc(npEn(c.obj)):"") : "";
}

function ctxOf(path){
  if(path==="c1") return {main:true};
  if(path==="c2") return SUBS.includes(S.link) ? {sub:true} : {coord:true};
  if(/^more\.\d+\.c$/.test(path)) return {coord:true};
  if(/\.relc$/.test(path)) return {rel:true};
  if(/\.clause$/.test(path)){ const it = getP(path.replace(/\.clause$/,"")); return it && it.kind==="quote" ? {quote:true} : {yeti:true}; }
  return {};
}
function titleOf(path){
  const x = ctxOf(path);
  if(x.main) return "Sentence";
  if(path==="c2") return x.sub ? LINKS[S.link]+" part" : "Second clause";
  if(/^more\.(\d+)\.c$/.test(path)) return "Clause "+(+path.split(".")[1]+3);
  if(x.rel) return "The one that…";
  if(x.quote) return "Quotation";
  if(x.yeti) return "That… clause";
  return "Clause";
}

function row(key, label, val, body, o){
  o = o || {};
  const open = UI.open===key;
  return `<div class="row2${open?" open":""}${o.off?" off":""}">
    <button class="rhead" data-row="${key}"><span class="rl">${label}${o.req?' <em>needed</em>':''}</span>
      <span class="rv">${val || `<span class="ph">${o.ph||"Add"}</span>`}</span><span class="chev">${open?"▴":"▾"}</span></button>
    ${open ? `<div class="rbody">${body}${o.hint?`<div class="hint">${o.hint}</div>`:""}</div>` : ""}</div>`;
}
const goBtn = (path, label) => `<button class="gobtn" data-go="${path}">${label} <span>›</span></button>`;

/* noun details: set ones always show as chips; the rest behind "+ details" */
function detailsBlock(path){
  const x = getP(path);
  if(!x) return "";
  if(x.kind==="clause") return goBtn(path+".clause", "Edit the clause (it takes yeti)");
  if(x.kind==="quote") return goBtn(path+".clause", "Edit the quoted sentence");
  if(!["word","name","gap","ga"].includes(x.kind)) return "";
  const m = x.mods || {}, mp = path+".mods", full = isFull();
  const depth = path.split(".").length;
  let h = "";
  if(x.kind==="ga") h += opts("One who…", tog(path+".ga.vu","-vu (state)")+tog(path+".ga.bi","can")+tog(path+".ga.du","wants to")+tog(path+".ga.neg","doesn't"));
  const chips = [];
  if(m.pos) chips.push(`<span class="chip">${x.kind==="ga"?"done to":"whose"}: ${esc(m.pos.en)}<button data-clear="${mp}.pos">×</button></span>`);
  if(m.dem) chips.push(`<span class="chip">that (na)<button data-clear="${mp}.dem">×</button></span>`);
  if(m.desc) chips.push(`<span class="chip">describe: ${esc(m.desc.en)}${m.desc.kind==="word"?`<button data-tog="${mp}.desc.vu" style="font-size:12px;${m.desc.vu?"font-weight:700":""}">-vu</button>`:""}<button data-clear="${mp}.desc">×</button></span>`);
  if(m.ta) chips.push(`<span class="chip">more than one (-ta)<button data-clear="${mp}.ta">×</button></span>`);
  if(m.jo) chips.push(`<span class="chip">little / dear (-jo)<button data-clear="${mp}.jo">×</button></span>`);
  if(chips.length) h += opts("", chips.join(""));
  if(m.num) h += `<div class="numrow">${m.num.q ? "how many?" : `Number <input type="number" inputmode="numeric" min="0" max="99" value="${esc(m.num.n)}" data-num="${mp}.num">`} counter
     <span class="opts small" style="margin:0">${setb(mp+".num.ctr","re","acts (-re)")}${setb(mp+".num.ctr","ko","thing (-ko)")}${tog(mp+".num.q","how many?")}</span><button class="x" data-clear="${mp}.num">×</button></div>`;
  if(m.relc) h += `<div class="opts small"><span class="ol">The one that…</span>${goBtn(mp+".relc", m.relc.verb ? esc(clauseSum(m.relc)) : "Build the clause")}<button class="x" data-clear="${mp}.relc" aria-label="Remove">×</button></div>`;
  if(m.join && m.join.items && m.join.items.length){
    h += opts("Join with:", setb(mp+".join.type","and","and (fa)")+setb(mp+".join.type","or","or (puso)")+m.join.items.map((it,i)=>`<span class="chip">${esc(it.en)}<button data-joinrm="${mp}.join" data-i="${i}">×</button></span>`).join(""));
  }
  const open = UI.det[path];
  const add = [];
  if(!m.pos) add.push(`<button data-open="${mp}.pos|owner">${x.kind==="ga"?"what it's done to (pe)":"whose"}</button>`);
  if(!m.dem) add.push(`<button data-tog="${mp}.dem">that (na)</button>`);
  if(!m.num) add.push(`<button data-numon="${mp}.num">number</button>`);
  if(!m.desc) add.push(`<button data-open="${mp}.desc|desc">describe</button>`);
  if(!m.ta) add.push(`<button data-tog="${mp}.ta">more than one (-ta)</button>`);
  if(full){
    if(!m.relc && depth < 9) add.push(`<button data-relon="${mp}.relc">the one that… (clause)</button>`);
    if(!m.jo) add.push(`<button data-tog="${mp}.jo">little / dear (-jo)</button>`);
    add.push(`<button data-open="${mp}.join|join">+ and / or</button>`);
  }
  h += `<button class="detbtn" data-det="${path}">${open ? "Hide details ▴" : "+ details"}</button>`;
  if(open) h += opts("Add:", add.join(""));
  return h;
}

function clauseScreen(px, c, ctx){
  const h = [], full = isFull();
  const top = ctx.main || ctx.coord || (ctx.sub && px==="c2");
  const type = ctx.main ? S.type : ctx.quote ? (c.qtype||"statement") : "statement";
  const cmd = type==="command", lets = type==="lets" && ctx.main;
  const nounMode = (name) => top || (ctx.quote && name==="obj" && false) ? "nounc" : "noun";

  // kind
  let kinds = null;
  if(ctx.main) kinds = full ? (S.link ? ["verb","is","compare"] : ["verb","is","compare","word"]) : ["verb","is"];
  else if(ctx.sub && S.link==="if") kinds = ["verb","is"];
  else if(ctx.coord) kinds = full ? ["verb","is","compare"] : ["verb","is"];
  if(kinds){
    if(!kinds.includes(c.kind)) kinds = [...kinds, c.kind];
    h.push(`<div class="seg">${kinds.map(k=>`<button data-set="${px}.kind" data-v="${k}" class="${c.kind===k?"on":""}">${{verb:"Does",is:ctx.sub?"X is / isn't Y":"X is Y",compare:"Compare",word:"One word"}[k]}</button>`).join("")}</div>`);
  }
  if(ctx.quote) h.push(`<div class="seg">${["statement","question","command"].map(k=>`<button data-set="${px}.qtype" data-v="${k}" class="${type===k?"on":""}">${k[0].toUpperCase()+k.slice(1)}</button>`).join("")}</div>`);
  if(ctx.rel) h.push(`<div class="hint" style="margin:0 0 8px">The noun fills whatever this clause leaves out — the one doing it, or what it's done to: <span class="lu">Mimiba gezemuze yãki</span>, the cup Mimi dropped (§6.1). Leave that slot empty.</div>`);
  if(ctx.yeti) h.push(`<div class="hint" style="margin:0 0 8px">This clause becomes a thing with yeti: <span class="lu">Konu yetini õze</span>, (she) said that (she) was tired (§6.1).</div>`);

  const roles = (allowTopic, allowDoer, allowDrop) => {
    const x = c.subj; if(!x) return "";
    const q = isQ(x), pron = x.kind==="pron";
    let s = "";
    if(allowTopic) s += `<button data-set="${px}.role" data-v="topic" class="${c.role==="topic"&&!q?"on":""}" ${q?"disabled":""}>As for… (topic)</button>`;
    if(allowDoer) s += `<button data-set="${px}.role" data-v="doer" class="${c.role==="doer"||q?"on":""}">Doer (ba)</button>`;
    if(allowDrop && pron) s += `<button data-set="${px}.role" data-v="drop" class="${c.role==="drop"?"on":""}">Leave out</button>`;
    return s ? opts("", s, false) : "";
  };
  const K = name => px+"|"+name;
  const nested = ctx.rel || ctx.yeti || (ctx.sub && px==="c2");

  if(c.kind==="word"){
    h.push(row(K("word"), "The word", nounSum(c.word),
      picker(px+".word","noun","Tap to pick") + opts("Or:", `<button data-setword="${px}|dã">yes (dã)</button><button data-setword="${px}|hena">no (hena)</button>`) + detailsBlock(px+".word"),
      {req:true, hint:"A bare noun is a whole sentence: a name to call someone, or the answer to a question-word question (§2.4a, §6.3)."}));
  }

  if(c.kind==="verb"){
    // verb row
    let vb = picker(px+".verb","verb","Tap to pick a verb");
    if(!lets){
      vb += opts("", (cmd?"":tog(px+".past","Past")) + tog(px+".neg", cmd?"Don't":"Not") + (!cmd ? tog(px+".can","Can (-bi)")+tog(px+".want","Want to (-du)") : "") + (full && !cmd ? tog(px+".ongoing","Ongoing (-ri)")+tog(px+".vu","State (-vu)") : ""), false);
      if(UIS.hints && !cmd) vb += `<div class="hint">No future form: without Past the verb means now or later — “will” and “going to” included (§4.1).</div>`;
      if(full && !cmd){
        vb += opts("Aspect:", setb(px+".aspect","ila","has done (ila)",1)+setb(px+".aspect","zoka","habitually (zoka)",1));
        vb += opts("ãto:", setb(px+".ato","always","always",1)+setb(px+".ato","never","never",1));
        vb += opts("How:", c.manner ? `<span class="chip">${esc(c.manner.en)}<button data-clear="${px}.manner">×</button></span>` : `<button data-open="${px}.manner|desc">pick a describing word</button>`);
        if(!nested) vb += opts("Certainty:", setb(px+".might","oya","might (oyã)",1)+setb(px+".might","cant","can't be (oyã hena)",1)+(c.might && ctx.main && SUBS.includes(S.link) ? tog(px+".mightWide","before the "+S.link+" part") : ""));
        if(!ctx.rel && !ctx.yeti){
          vb += opts("Make / let:", setb(px+".aux","tsobã","make (tsobã)",1)+setb(px+".aux","idovu","let (idovu)",1));
          if(c.aux) vb += opts("On "+c.aux+":", tog(px+".auxNeg","Not")+tog(px+".auxCan","Can")+tog(px+".auxWant","Want to"));
        }
        if((ctx.main && (!S.link || SUBS.includes(S.link))) || ctx.quote)
          vb += opts("Source:", setb(px+".evid","la","heard / felt (la)",1)+setb(px+".evid","po","it seems (po)",1)+setb(px+".evid","ke","I assume (ke)",1));
        if(!nested) vb += opts("Ask:", tog(px+".why","how / why? (emosedi)"));
        vb += opts("Second verb:", c.verb2 ? setb(px+".vjoin","and","and (fa)")+setb(px+".vjoin","or","or (puso)")+`<span class="chip">${esc(c.verb2.en)}<button data-clear="${px}.verb2">×</button></span>`+tog(px+".neg2","not "+esc(c.verb2.en)) : `<button data-open="${px}.verb2|verb">+ and / or another verb</button>`);
      } else if(!full && !cmd && (c.ongoing||c.vu||c.aspect||c.ato||c.manner||c.might||c.aux||c.evid||c.why||c.verb2)){
        vb += `<div class="hint">This verb uses Full options. Switch to Full to see them.</div>`;
      }
    }
    h.push(row(K("verb"), "Verb", verbSum(c), vb, {req:true, ph:"Pick a verb"}));

    if(c.aux) h.push(row(K("causee"), `Who is ${c.aux==="tsobã"?"made":"let"} to do it`, nounSum(c.causee), picker(px+".causee","noun","Tap to pick")+detailsBlock(px+".causee"), {hint:"Takes di if the verb can take an object, said or not; ni only if it never takes one (§4.10)."}));

    // subject
    if(cmd && ctx.main) h.push(row(K("subj"), "Who does it", `<span class="ph">none — a command has no subject (§4.5)</span>`, "", {off:true}));
    else if(lets) h.push(row(K("subj"), "Who does it", `we (you and me) <span class="lu">luswazo</span>`, `<div class="hint">Fixed for let's (§4.10).</div>`, {off:true}));
    else if(!(ctx.quote && cmd)){
      const subOnlyBa = ctx.sub || ctx.rel || ctx.yeti;
      h.push(row(K("subj"), c.aux?"Who makes or lets":"Who or what does it", nounSum(c.subj)+(c.subj && c.role==="drop" && !subOnlyBa?' <span class="tags">left out</span>':""),
        picker(px+".subj", nounMode("subj"), "Optional") + (subOnlyBa ? "" : roles(true, true, true)) + detailsBlock(px+".subj"),
        {hint: subOnlyBa ? "No topic in here, so it takes ba (§6.2)." : isQ(c.subj) ? "A question word as subject takes ba (§3.6)." : (UIS.hints && (!c.subj || c.subj.kind==="pron")) ? "Usually left empty for I or you: a neutral sentence has no pronoun in it (§2.3)." : ""}));
    }

    // object
    const trv = getTrans(c.verb), ven = c.verb ? esc(c.verb.en) : "";
    const objHint = trv==="intr" ? `“${ven}” takes no object.` : trv==="tr" ? `“${ven}” takes an object.` : trv==="both" ? `“${ven}” works with or without an object.` : "";
    h.push(row(K("obj"), "Object — what it's done to", nounSum(c.obj), picker(px+".obj", nounMode("obj"), "Optional")+detailsBlock(px+".obj"), {hint:objHint, off:trv==="intr"&&!c.obj}));

    // di slot
    h.push(row(K("dip"), c.vu ? "By whom (di)" : "To / with / by / about (di)", nounSum(c.dip), picker(px+".dip","noun","Optional")+detailsBlock(px+".dip"),
      {hint: c.vu ? "With -vu the one who did it takes di (§4.11)." : "A person, a tool or a cause: to someone, with something, about something. A place you go to belongs in Where (§2.2, §5.2)."}));

    // when / where
    const canFrame = full && !(ctx.main && SUBS.includes(S.link)) && (c.time||c.place) && ((lets) || (c.subj && c.role==="topic" && !isQ(c.subj) && !cmd && !nested));
    const frameBtn = canFrame ? opts("", tog(px+".frame", lets ? "Say when / where before luswazo" : "Say when / where before the topic")) : "";
    const tsum = c.time ? ({from:"from ",until:"until "}[c.trel]||"")+nounSum(c.time) : "";
    const topts = c.time && !isQ(c.time) && full ? opts("", setb(px+".trel","at","at / on")+setb(px+".trel","from","from (toma)")+setb(px+".trel","until","until (rowo)")) : "";
    h.push(row(K("time"), "When", tsum, picker(px+".time","time","Optional")+topts+detailsBlock(px+".time")+(c.time?frameBtn:"")));
    const pl = c.place, deic = pl && pl.kind==="word" && DEICTIC[pl.lu];
    const psum = pl ? (isQ(pl) ? "" : ({to:"to ",from:"from "}[c.rel]||""))+nounSum(pl) : "";
    const popts = pl && !isQ(pl) ? opts("", setb(px+".rel","at","at / in")+setb(px+".rel","to","to")+setb(px+".rel","from","from"), false) : "";
    h.push(row(K("place"), "Where", psum, picker(px+".place","place","Optional")+popts+(deic?"":detailsBlock(px+".place"))+(!c.time?frameBtn:"")));
  }

  if(c.kind==="is"){
    if(ctx.sub){
      h.push(row(K("pred"), "…is what", nounSum(c.pred), picker(px+".pred","noun","Tap to pick")+detailsBlock(px+".pred"), {req:true}));
    } else {
      h.push(row(K("subj"), "What you're talking about", nounSum(c.subj), picker(px+".subj","noun","Optional")+roles(true,false,true)+detailsBlock(px+".subj"),
        {hint: isQ(c.subj) ? "A question word here takes ba, and there's no jĩ (§3.6)." : ""}));
      h.push(row(K("pred"), "…is what", nounSum(c.pred), picker(px+".pred","noun","Tap to pick")+detailsBlock(px+".pred"), {req:true}));
    }
    h.push(row(K("isopts"), "Past / not", [c.past?"was":"", c.neg?"not":""].filter(Boolean).join(" · ") || `<span class="ph">is</span>`,
      opts("", tog(px+".past","Past (was)")+tog(px+".neg","Not"), false),
      {hint: ctx.sub ? "If it isn't X: X henana. If it was / wasn't X: X guzena / guenazena (§6.1a)." : "No word for \"is\" now; \"was\" is guze (§4.6)."}));
  }

  if(c.kind==="compare"){
    h.push(row(K("subj"), "Who or what", nounSum(c.subj), picker(px+".subj","noun","Tap to pick")+roles(true,true,false)+detailsBlock(px+".subj"), {req:true}));
    h.push(row(K("std"), c.cmp==="as" ? "As … as" : "More than", nounSum(c.std), picker(px+".std","noun","Tap to pick")+opts("", setb(px+".cmp","more","more than (kügi)")+setb(px+".cmp","as","as … as (uã)"), false)+detailsBlock(px+".std"), {req:true}));
    h.push(row(K("verb"), "Describing word", verbSum(c), picker(px+".verb","desc","e.g. fast, big, tired")+opts("", tog(px+".past","Past")+tog(px+".neg","Not"), false), {req:true}));
  }
  return h.join("");
}

const LINKS = {mishi:"and (mishi)", noro:"but (norõ)", if:"if", when:"when", because:"because", since:"since (toma)", until:"until (rowo)"};
function clausesSection(){
  if(S.c1.kind==="word") return "";
  let h = `<div class="ghead2">More clauses</div>`;
  if(!S.link){
    if(!isFull()) return "";
    return h + `<div class="addc">${Object.entries(LINKS).map(([k,l])=>`<button data-link="${k}">${l}</button>`).join("")}</div>`;
  }
  const sub = SUBS.includes(S.link);
  h += `<div class="crow">${goBtn("c2", (sub ? esc(LINKS[S.link])+" part (comes first): " : "and / but: ")+(clauseSum(S.c2)||"<i>empty</i>"))}<button class="x" data-rmlink="1" aria-label="Remove">×</button></div>`;
  h += opts("Joined by:", Object.entries(LINKS).map(([k,l])=>`<button data-link="${k}" class="${S.link===k?"on":""}">${l}</button>`).join(""));
  if(!sub){
    (S.more||[]).forEach((m,i)=>{
      h += `<div class="crow">${goBtn("more."+i+".c", "Clause "+(i+3)+": "+(clauseSum(m.c)||"<i>empty</i>"))}<button class="x" data-rmmore="${i}" aria-label="Remove">×</button></div>`;
      h += opts("Joined by:", setb("more."+i+".link","mishi","and (mishi)")+setb("more."+i+".link","noro","but (norõ)"));
    });
    h += `<div class="addc"><span>Add another:</span><button data-addmore="mishi">and (mishi)</button><button data-addmore="noro">but (norõ)</button></div>`;
  }
  return h;
}

function usesFull(){
  const c = S.c1;
  return !!(S.link || c.kind==="compare" || c.kind==="word" || c.ongoing || c.vu || c.aspect || c.ato || c.manner || c.might || c.evid || c.aux || c.verb2 || c.why || c.frame || (c.trel && c.trel!=="at"));
}

function renderEditor(){
  UI.stack = UI.stack.filter((p,i)=> i===0 || getP(p));
  if(!UI.stack.length) UI.stack = ["c1"];
  const path = UI.stack[UI.stack.length-1];
  const ctx = ctxOf(path), c = getP(path);
  document.querySelectorAll("#modeSeg button").forEach(b=>b.classList.toggle("on", b.dataset.mode===UIS.mode));
  $("#types").style.display = UI.stack.length>1 ? "none" : "";
  let h = "";
  if(UI.stack.length>1) h += `<div class="crumbs"><button data-back="1">‹ Back</button><span>${UI.stack.map(titleOf).map(esc).join(" › ")}</span></div>`;
  else if(!isFull() && usesFull()) h += `<div class="hint" style="margin:0 0 8px">This sentence uses Full options. Switch to Full to see all of them.</div>`;
  h += clauseScreen(path, c, ctx);
  if(path==="c1") h += clausesSection();
  $("#slots").innerHTML = h;
}
function renderSlots(){ renderEditor(); }

$("#slots").addEventListener("click", e=>{
  const b = e.target.closest("button"); if(!b) return;
  const d = b.dataset;
  if(d.row){ UI.open = UI.open===d.row ? null : d.row; render(); return; }
  if(d.go){ UI.stack.push(d.go); UI.open = null; render(); window.scrollTo({top:0}); return; }
  if(d.back){ UI.stack.pop(); UI.open = null; render(); return; }
  if(d.det){ UI.det[d.det] = !UI.det[d.det]; render(); return; }
  if(d.open){ const [path, mode] = d.open.split("|"); openSheet(path, mode); return; }
  if(d.clear){ setP(d.clear, d.clear.endsWith(".dem")||d.clear.endsWith(".ta")||d.clear.endsWith(".jo") ? false : null); render(); return; }
  if(d.tog){ setP(d.tog, !getP(d.tog)); render(); return; }
  if(d.set){
    const cur = getP(d.set);
    setP(d.set, (d.unset && cur===d.v) ? "" : d.v);
    if(/\.kind$/.test(d.set)){ const cl = getP(d.set.replace(/\.kind$/,"")); if(d.v==="compare" && cl.role==="drop") cl.role = "doer"; if(d.v==="is" && cl.role==="doer") cl.role = "topic"; }
    render(); return;
  }
  if(d.numon){ setP(d.numon, {n:2, ctr:"re"}); render(); return; }
  if(d.joinrm){ const j = getP(d.joinrm); j.items.splice(+d.i,1); if(!j.items.length) setP(d.joinrm, null); render(); return; }
  if(d.link){ const fresh = !S.link; S.link = d.link; if(!S.c2) S.c2 = blankClause(); if(SUBS.includes(d.link)){ if(!(d.link==="if" && S.c2.kind==="is")) S.c2.kind = "verb"; S.more = []; } if(fresh){ UI.stack.push("c2"); UI.open = null; } render(); return; }
  if(d.rmlink){ S.link = ""; S.c2 = null; S.more = []; render(); return; }
  if(d.addmore){ (S.more = S.more||[]).push({link:d.addmore, c:blankClause()}); UI.stack.push("more."+(S.more.length-1)+".c"); UI.open = null; render(); return; }
  if(d.rmmore){ S.more.splice(+d.rmmore,1); render(); return; }
  if(d.relon){ setP(d.relon, blankClause()); UI.stack.push(d.relon); UI.open = null; render(); window.scrollTo({top:0}); return; }
  if(d.setword){ const [px, w] = d.setword.split("|"); setP(px+".word", {kind:"word", lu:w, en: w==="dã"?"yes":"no"}); render(); return; }
});
$("#slots").addEventListener("change", e=>{

  const n = Math.max(0, Math.min(99, parseInt(el.value,10)||0));
  const num = getP(el.dataset.num) || {ctr:"re"}; num.n = n; setP(el.dataset.num, num); render();
