$("#types").addEventListener("click", e=>{ const b = e.target.closest("button"); if(!b) return; S.type = b.dataset.t; render(); });
$("#modeSeg").addEventListener("click", e=>{ const b = e.target.closest("button"); if(!b) return; UIS.mode = b.dataset.mode; saveUI(); render(); });

/* ---------- saved sentences ---------- */
const SAVEKEY = "lunaji-composer-saved";
function getSaved(){ try{ const o = JSON.parse(ls.get(SAVEKEY)||"null"); if(o && o.lists && typeof o.lists==="object") { if(!o.lists[o.current]) o.current = Object.keys(o.lists)[0] || "My sentences"; if(!o.lists[o.current]) o.lists[o.current] = []; return o; } }catch(e){} return {current:"My sentences", lists:{"My sentences":[]}}; }
function putSaved(o){ ls.set(SAVEKEY, JSON.stringify(o)); }
function updateSavedCount(){ const o = getSaved(); $("#savedBtn").textContent = `Saved (${(o.lists[o.current]||[]).length})`; }
function flash(msg){ const f = $("#flash"); f.textContent = msg; f.classList.add("on"); clearTimeout(flash.t); flash.t = setTimeout(()=>f.classList.remove("on"), 1600); }
$("#saveBtn").onclick = () => {
  const c = compose(); if(!c.ready || c.nc.length){ flash("Build a sentence first."); return; }
  const o = getSaved();
  o.lists[o.current].push({lu: $("#sentence").innerText.trim(), en: c.built.join(" · "), state: JSON.parse(JSON.stringify(S)), at: Date.now()});
  putSaved(o); updateSavedCount(); flash("Saved to “"+o.current+"”");
};
$("#savedBtn").onclick = () => { drawSaved(); $("#scrim").classList.add("on"); $("#saved").classList.add("on"); };
$("#savedClose").onclick = () => { $("#saved").classList.remove("on"); $("#scrim").classList.remove("on"); };
function drawSaved(){
  const o = getSaved(), list = o.lists[o.current] || [];
  const names = Object.keys(o.lists);
  let h = `<div class="opts small" style="margin:0 0 6px">${names.map(n=>`<button data-list="${esc(n)}" class="${n===o.current?"on":""}">${esc(n)} (${o.lists[n].length})</button>`).join("")}<button data-newlist="1">+ new list</button></div>`;
  h += `<div class="opts small" style="margin:0 0 10px"><button data-renlist="1">rename</button><button data-copylist="1">copy list as text</button>${names.length>1?`<button data-dellist="1">delete list</button>`:""}</div>`;
  if(!list.length) h += `<div class="more2">Nothing saved in “${esc(o.current)}” yet. Build a sentence and tap Save.</div>`;
  list.forEach((it,i)=>{
    h += `<div class="sv"><button class="svopen" data-load="${i}"><span class="lu">${esc(it.lu)}</span><span class="svb">${esc(it.en)}</span></button><button class="x" data-del="${i}" aria-label="Delete">×</button></div>`;
  });
  h += `<div class="more2">Saved on this device only.</div>`;
  $("#savedList").innerHTML = h;
}
$("#savedList").addEventListener("click", e=>{
  const b = e.target.closest("button"); if(!b) return;
  const d = b.dataset, o = getSaved();
  if(d.list){ o.current = d.list; putSaved(o); }
  else if(d.newlist){ const n = (prompt("Name for the new list (e.g. Lesson 3):")||"").trim(); if(n){ if(!o.lists[n]) o.lists[n] = []; o.current = n; putSaved(o); } }
  else if(d.renlist){ const n = (prompt("New name for “"+o.current+"”:", o.current)||"").trim(); if(n && n!==o.current && !o.lists[n]){ o.lists[n] = o.lists[o.current]; delete o.lists[o.current]; o.current = n; putSaved(o); } }
  else if(d.dellist){ if(confirm("Delete the list “"+o.current+"” and its sentences?")){ delete o.lists[o.current]; o.current = Object.keys(o.lists)[0]; putSaved(o); } }
  else if(d.copylist){
    const txt = o.current+"\n\n"+(o.lists[o.current]||[]).map((it,i)=>`${i+1}. ${it.lu}\n   ${it.en}`).join("\n");
    try{ navigator.clipboard.writeText(txt); flash("List copied"); }catch(err){ flash("Couldn't copy"); }
  }
  else if(d.del){ o.lists[o.current].splice(+d.del,1); putSaved(o); }
  else if(d.load){
    const it = o.lists[o.current][+d.load]; if(!it) return;
    loadState(JSON.parse(JSON.stringify(it.state)));
    UI.stack = ["c1"]; UI.open = null;
    $("#saved").classList.remove("on"); $("#scrim").classList.remove("on");
    render(); window.scrollTo({top:0}); return;
  }
  drawSaved(); updateSavedCount();
});
function loadState(s){
  S = Object.assign(blank(), s);
  S.c1 = Object.assign(blankClause(), s.c1||{});
  S.c2 = s.c2 ? Object.assign(blankClause(), s.c2) : null;
  S.more = Array.isArray(s.more) ? s.more.map(m=>({link:m.link, c:Object.assign(blankClause(), m.c)})) : [];
}

/* ---------- picker sheet ---------- */
let sheet = null;
const TITLES = {nounc:"Pick a word or a clause", verb:"Pick a verb", desc:"Pick a describing word", noun:"Pick a word", owner:"Whose?", join:"Add another (and / or)", time:"When", place:"Where"};
function openSheet(path, mode){
  if(!LEX){ alert("Load the lexicon first."); return; }
  sheet = {path, mode};
  $("#sheetTitle").textContent = TITLES[mode] || "Pick";
  $("#q").value = "";
  drawList();
  $("#scrim").classList.add("on"); $("#sheet").classList.add("on");
  setTimeout(()=>{ try{ $("#q").focus({preventScroll:true}); }catch(e){} }, 50);
}
function closeSheet(){ $("#scrim").classList.remove("on"); $("#sheet").classList.remove("on"); sheet = null; }
$("#scrim").onclick = () => { closeSheet(); $("#saved").classList.remove("on"); }; $("#sheetClose").onclick = closeSheet;
$("#q").addEventListener("input", drawList);

function matchScore(q, g, k){
  if(!q) return 1;
  const gl = g.toLowerCase(), sg = shortGloss(g).toLowerCase();
  const words = gl.replace(/[^a-z0-9' ]+/g," ").split(" ").filter(Boolean);
  if(sg===q || words.join(" ")===q) return 100;
  if(words.includes(q)) return 80;
  if(words.some(w=>w.startsWith(q))) return 60;
  if(q.length>=4 && gl.includes(q)) return 40;
  if(k && stripMarks(k).startsWith(stripMarks(q))) return 30;
  return 0;
}
function filterItems(items, q){
  return items.map(it=>({it, s:Math.max(matchScore(q, it.full||it.en, it.lu), matchScore(q, it.en, it.lu))})).filter(x=>x.s>0).sort((a,b)=>b.s-a.s).map(x=>x.it);
}
function drawList(){
  if(!sheet) return;
  const {mode} = sheet;
  const raw = $("#q").value.trim(), q = raw.toLowerCase();
  const secs = [];
  const fromLex = k => inLex(k) ? {kind:"word", lu:k, en:DEICTIC[k] || glossOf(k)} : null;
  const prons = () => PRONOUNS.filter(p=>inLex(p.lu)||inLex(p.base)).map(p=>({kind:"pron", lu:p.lu, en:p.en}));
  const names = () => getNames().map(n=>({kind:"name", lu:n, en:n, show:"name"}));
  const nouns = (filter) => NOUNS.filter(filter||(()=>true)).map(n=>({kind:"word", lu:n.k, en:shortGloss(n.g), full:n.g}));
  const verbs = (filter) => VERBS.filter(filter||(()=>true)).map(v=>({kind:"word", lu:v.k, en:shortGloss(v.g), show:verbBare(v.k), full:v.g}));
  if(mode==="verb") secs.push(["Verbs", verbs()]);
  if(mode==="desc"){ secs.push(["Describing words", verbs(v=>v.adj)]); secs.push(["Other verbs", verbs(v=>!v.adj)]); }
  if(mode==="nounc"){
    const isObj = /\.obj$/.test(sheet.path);
    secs.push(["A whole clause", [{kind:"clause", lu:"yeti", en:"that… — a whole clause (yeti)"}, ...(isObj ? [{kind:"quote", lu:"“…”", en:"“…” — a quotation (with onu)"}] : [])]]);
  }
  if(mode==="noun"||mode==="nounc"||mode==="owner"||mode==="join"){
    secs.push(["People words", prons()]);
    if(names().length) secs.push(["Names", names()]);
    if(mode==="noun"||mode==="nounc") secs.push(["Ask", [{kind:"q", lu:"mõzo", en:"who? (something that acts)"},{kind:"q", lu:"emose", en:"what? (a thing)"}]]);
    if(mode==="owner") secs.push(["Ask", [{kind:"q", lu:"mõzo", show:"mõzope", en:"whose?"}]]);
    secs.push(["Nouns", nouns()]);
    if(q) secs.push(["One who… (-ga)", VERBS.map(v=>({kind:"ga", lu:v.k, en:"one who "+shortGloss(v.g).replace(/^be /,"is "), show:verbBare(v.k)+"ga", full:v.g}))]);
  }
  if(mode==="time"){
    secs.push(["Pointing from now — no wa", TIME_DEICTIC.map(fromLex).filter(Boolean)]);
    secs.push(["Times of day — take wa", TIME_NAMES.map(fromLex).filter(Boolean)]);
    secs.push(["Ask", [{kind:"q", lu:"emose", fixed:"wa", show:"emosewa", en:"when?"}]]);
    secs.push(["Other nouns — take wa", nouns(n=>!DEICTIC[n.k]&&!TIME_NAMES.includes(n.k))]);
  }
  if(mode==="place"){
    secs.push(["Pointing from here — no wa", PLACE_DEICTIC.map(fromLex).filter(Boolean)]);
    secs.push(["Ask", [{kind:"q", lu:"emose", fixed:"wa", show:"emosewa", en:"where?"},{kind:"q", lu:"emose", fixed:"toma", show:"emose toma", en:"from where?"}]]);
    secs.push(["Places and things — take wa", nouns(n=>!DEICTIC[n.k])]);
  }
  let html = "", total = 0; const store = [];
  for(const [title, items] of secs){
    const list = q ? filterItems(items, q) : items;
    if(!list.length) continue;
    const cap = q ? 60 : 400;
    html += `<div class="sec">${esc(title)}</div>`;
    list.slice(0,cap).forEach(it=>{ const i = store.length; store.push(it);
      html += `<button class="it" data-pick="${i}"><span>${esc(it.en)}</span><span class="l lu">${esc(it.show||it.lu)}</span></button>`; });
    if(list.length>cap) html += `<div class="more2">${list.length-cap} more — type to narrow</div>`;
    total += list.length;
  }
  const nmSpell = /y$/i.test(raw) ? raw.slice(0,-1)+"i" : raw;
  if(q && (mode==="noun"||mode==="nounc"||mode==="owner"||mode==="join")) html += `<button class="gapbtn namebtn" data-name="1">Use “${esc(nmSpell.charAt(0).toUpperCase()+nmSpell.slice(1))}” as a name${nmSpell!==raw?" — a final y sound is spelled i (§2)":""}</button>`;
  if(q) html += `<button class="gapbtn" data-gap="1">${total?"Not here? ":"No Lunaji word found. "}Use “${esc(raw)}” as a gap</button>`;
  if(!html) html = `<div class="more2">Nothing to show.</div>`;
  const el = $("#sheetList"); el.innerHTML = html; el.scrollTop = 0;
  el.onclick = e=>{
    const b = e.target.closest("button"); if(!b) return;
    let item = null;
    if(b.dataset.gap) item = {kind:"gap", en:raw};
    else if(b.dataset.name){ const n = nmSpell.charAt(0).toUpperCase()+nmSpell.slice(1); addName(n); item = {kind:"name", lu:n, en:n}; }
    else { const it = store[+b.dataset.pick]; if(it){
      item = {kind:it.kind, lu:it.lu, en:it.en, show:it.show, fixed:it.fixed};
      if(it.kind==="ga") item = {kind:"ga", en:it.en, show:it.show, verb:{kind:"word", lu:it.lu, en:shortGloss(it.full)}, ga:{}};
      if(it.kind==="clause" || it.kind==="quote") item.clause = blankClause();
    } }
    if(item) pickItem(item);
  };
}
function pickItem(item){
  const {path, mode} = sheet;
  if(mode==="join"){
    const j = getP(path) || {type:"and", items:[]};
    j.items.push(item); setP(path, j);
  } else {
    setP(path, item);
    if(/\.subj$/.test(path)){ const cl = getP(path.replace(/\.subj$/,"")); if(cl && item.kind!=="pron" && cl.role==="drop") cl.role = cl.kind==="compare" ? "doer" : "topic"; if(cl && item.kind==="clause") cl.role = "doer"; }
    if(item.kind==="clause" || item.kind==="quote"){ UI.stack.push(path+".clause"); UI.open = null; }
  }
  closeSheet(); render();
}

/* ---------- lexicon panel ---------- */
function renderLexPanel(){
  const n = LEX ? Object.keys(LEX).length : 0;
  $("#lexline").textContent = LEX ? `${n} words · ${LEXSRC}` : "no lexicon loaded";
  $("#stamp").textContent = "build " + BUILD;
  $("#nolex").innerHTML = LEX ? "" : `<div class="empty-lex">No lexicon yet. Put the Forge's lexicon save on the site as <b>${LEX_URL}</b> next to this page, or load the file below.</div>`;
  $("#lexpanel").innerHTML = `Lexicon: ${LEX ? `${n} words (${NOUNS.length} nouns, ${VERBS.length} verbs), ${esc(LEXSRC)}.` : "none loaded."}
    <br><label>Load a lexicon file<input type="file" id="lexfile" accept=".txt,.json,text/plain,application/json"></label><button id="lexreload">Reload from site</button><button id="resetAll">Clear sentence</button><button id="hintsBtn">Beginner hints: ${UIS.hints?"on":"off"}</button>`;
  $("#hintsBtn").onclick = () => { UIS.hints = !UIS.hints; saveUI(); renderLexPanel(); render(); };
  $("#lexfile").onchange = e => { const f = e.target.files[0]; if(f) loadFile(f); };
  $("#lexreload").onclick = () => loadLex();
  $("#resetAll").onclick = () => { S = blank(); UI.stack = ["c1"]; UI.open = null; render(); };
}

renderLexPanel();
render();
updateSavedCount();
loadLex();
</script>
</body>
</html>
