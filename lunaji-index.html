<!DOCTYPE html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lunaji Index</title>
<style>
:root{--bg:#12100f;--fg:#e8e2d9;--dim:#8b8177;--accent:#c9a227;--line:#2a2622;--card:#181513}
*{box-sizing:border-box}
body{margin:0;padding:0 14px 60px;background:var(--bg);color:var(--fg);
     font:16px/1.5 ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{position:sticky;top:0;background:var(--bg);padding:14px 0 8px;border-bottom:1px solid var(--line);z-index:5}
h1{margin:0 0 2px;font-size:19px;letter-spacing:.02em}
h1 span{color:var(--accent)}
.sub{color:var(--dim);font-size:12.5px;margin:0 0 10px}
input{width:100%;padding:11px 12px;font-size:16px;border-radius:9px;
      border:1px solid var(--line);background:var(--card);color:var(--fg)}
input:focus{outline:none;border-color:var(--accent)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.tag{font-size:12px;padding:5px 10px;border-radius:999px;border:1px solid var(--line);
     background:var(--card);color:var(--dim);cursor:pointer}
.tag[data-on="1"]{border-color:var(--accent);color:var(--accent)}
.count{color:var(--dim);font-size:12px;margin:12px 0 6px}
ul{list-style:none;margin:0;padding:0}
li{padding:11px 0;border-bottom:1px solid var(--line)}
.k{font-weight:600}
.k em{color:var(--accent);font-style:normal}
.loc{display:inline-block;margin-top:3px;font-size:13.5px;color:var(--accent)}
.loc b{font-weight:600}
.note{display:block;margin-top:3px;font-size:13px;color:var(--dim)}
.alias{display:block;margin-top:2px;font-size:12px;color:#6d645b}
.open{color:#d98a4a}
footer{margin-top:26px;color:var(--dim);font-size:12.5px;line-height:1.6}
mark{background:none;color:var(--accent)}
</style>

<header>
  <h1>Lunaji <span>index</span></h1>
  <p class="sub">Where things live, not what they say. Current to 2026-09-10.</p>
  <input id="q" placeholder="flower, plural, negation, stress…" autocomplete="off">
  <div class="tags" id="tags"></div>
</header>

<p class="count" id="count"></p>
<div id="coinbar" style="margin:14px 0 6px"></div>
<div id="coinout"></div>
<ul id="out"></ul>

<footer>
  <b>Files:</b> Grammar · Phonology · Lexicology · Dictionary · Proto &amp; Sound Changes.<br>
  Section numbers are the stable layer — they survive rewrites of the text inside them.<br>
  <span class="open">Orange</span> marks something still open.
</footer>

   you had to know where to look before you could look it up.                  */
const CLASSES = ["verb","noun","function word","suffix","numeral"];
const C = [

let active = "";
const $ = i => document.getElementById(i);

let coinCls = "";
CLASSES.forEach(c=>{
  const b=document.createElement("div"); b.className="tag"; b.textContent="coining a " + c;
  b.onclick=()=>{ coinCls = coinCls===c ? "" : c;
    [...$("coinbar").children].forEach(x=>x.dataset.on = x.textContent==="coining a "+coinCls ? "1":"0");
    paintCoin(); };
  $("coinbar").appendChild(b);
});
function paintCoin(){
  if(!coinCls){ $("coinout").innerHTML = ""; return; }
  const rows = C.filter(r=>r[0].includes(coinCls));
  $("coinout").innerHTML =
    `<p class="note" style="margin:8px 0">${rows.length} constraints bind a ${coinCls}. Everything below is already written down somewhere — this is only the list of where.</p>` +
    `<ul>` + rows.map(r=>`<li>
       <span class="note">${r[1]}</span>
       <span class="loc">${r[2]}</span>
     </li>`).join("") + `</ul>`;
}

FILES.forEach(f=>{
  const b=document.createElement("div"); b.className="tag"; b.textContent=f;
  b.onclick=()=>{ active = active===f ? "" : f;
    [...$("tags").children].forEach(c=>c.dataset.on = c.textContent===active ? "1":"0");
    render(); };
  $("tags").appendChild(b);
});

function hl(s,q){ if(!q) return s;
  return s.replace(new RegExp("("+q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","ig"),"<mark>$1</mark>"); }

function render(){
  const q = $("q").value.trim().toLowerCase();
  const rows = D.filter(r=>{
    if(active && r[1]!==active) return false;
    if(!q) return true;
    return (r[0]+" "+r[2]+" "+r[3]+" "+(r[4]||"")).toLowerCase().includes(q);
  });
  $("count").textContent = rows.length + (rows.length===1?" entry":" entries")
    + (active?" · "+active:"") + (q?" matching “"+$("q").value.trim()+"”":"");
  $("out").innerHTML = rows.map(r=>`<li>
      <span class="k">${hl(r[0],q)}${r[5]?' <em>· open</em>':''}</span>
      <span class="loc"><b>${r[1]}</b> ${r[2]}</span>
      <span class="note">${hl(r[3],q)}</span>
      ${r[4]?`<span class="alias">${hl(r[4],q)}</span>`:""}
    </li>`).join("") ||
    `<li><span class="note">Nothing matches. Try a plainer word — the aliases carry things like “flowers”, “but”, “bigger than”.</span></li>`;
}
$("q").oninput = render;
render();
